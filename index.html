    body = `<div style="display:grid;grid-template-columns:1fr 1.25fr .85fr;gap:14px;align-items:start"><div class="col" style="gap:14px">${det}</div><div class="col" style="gap:14px">${mid}</div><div class="col" style="gap:14px">${right}</div></div>`;
  } else if(tab==='contacts'){
    body = `<div class="card rounded"><div class="thead" style="grid-template-columns:1.2fr 1fr 1fr .6fr .6fr .7fr">Name<span>Role</span><span>Email</span><span>Primary</span><span>Billing</span><span>Portal</span></div>${c.contacts.map(ct=>`<div class="trow" style="grid-template-columns:1.2fr 1fr 1fr .6fr .6fr .7fr"><span>${esc(ct.n)}</span><span class="muted">${ct.r}</span><span class="muted">${ct.n.split(' ')[0].toLowerCase()}@${c.short.toLowerCase().replace(/[^a-z]/g,'')}.com</span><span>${ct.primary?'✓':'—'}</span><span>${ct.billing?'✓':'—'}</span><span>${ct.portal?'<span class="success">active</span>':'<button class="btn sm" onclick="toast(\'Portal invitation sent.\')">Invite</button>'}</span></div>`).join('')}<div class="legend">Portal users see only this client's records with visibility = client.</div></div>`;
  } else if(tab==='projects'){
    body = projectsTable(projects);
  } else if(tab==='documents'){
    body = docsTable(DB.documents.filter(d=>d.client===c.short));
  } else if(tab==='invoices'){
    body = invoicesTable(DB.invoices.filter(i=>i.client===c.short));
  } else if(tab==='notes'){
    body = `<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start"><div class="card pad"><div class="h13" style="margin-bottom:10px">Emails & notes</div><div style="display:flex;flex-direction:column;gap:11px">${c.timeline.map(e=>`<div style="display:flex;gap:10px"><div style="width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none;background:${e.auto?'var(--accent)':'var(--inactive)'}"></div><div><div style="font-size:11.5px;font-weight:500">${e.t}</div><div class="faint" style="font-size:10.5px">${e.m}</div></div></div>`).join('')||'<div class="ghost">Nothing logged yet.</div>'}</div></div><div class="card pad"><div class="h13" style="margin-bottom:8px">Compose</div><textarea class="ta" placeholder="Write an email or an internal note…"></textarea><div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm">Email</button><button class="btn sm">Note</button><button class="btn sm brand-o">✦ AI draft</button></div></div></div>`;
  } else {
    body = `<div class="card pad" style="max-width:560px"><div class="h13" style="margin-bottom:8px">Compliance</div>${[['KYC / identity of UBOs','complete','success'],['Sanctions & PEP screening','complete · 21 Aug','success'],['Engagement letter on file','signed','success'],['Conflict check','not recorded','danger'],['Source of funds (for deposit)','n/a','muted']].map(([a,b,cl])=>`<div class="kv"><span class="k">${a}</span><span class="${cl}">${b}</span></div>`).join('')}<div class="hint" style="margin-top:10px">Compliance fields were not in the design handover — placeholder content to show where they'd live.</div></div>`;
  }
  return `<div class="col" style="gap:14px">${header}<div class="tabs">${tabs}</div>${body}</div>`;
}

/* ============ PROJECTS LIST ============ */
function pips(p){
  return `<span class="pips">${STAGES.map((_,i)=>{const s=i+1;let cl='';if(p.status==='delivered'||s<p.stage)cl='done';else if(s===p.stage)cl=blocked(p)?'blk':'cur';return `<i class="${cl}"></i>`;}).join('')}</span>`;
}
function projectsTable(list){
  const rows = list.map(p=>{const b=blocked(p);return `<div class="trow click${b?' attn':''}" style="grid-template-columns:.62fr 1.1fr .82fr 2.1fr .5fr .55fr .62fr;gap:11px;padding:12px 15px" tabindex="0" onclick="go('#/project/${p.code}')"><span>${p.code}</span><span>${esc(p.clientName)}</span><span class="muted">${SERVICE[p.service]}</span>${pips(p)}<span class="muted">${p.owner}</span><span>${k(p.fee,p.entity==='UK'?'GBP':'EUR')}</span><span class="${p.overdue?'danger w500':'muted'}">${p.due}</span></div>`;}).join('');
  return `<div class="card rounded"><div class="thead" style="grid-template-columns:.62fr 1.1fr .82fr 2.1fr .5fr .55fr .62fr;gap:11px;padding:9px 15px">Code<span>Client</span><span>Service</span><span>Stage</span><span>Owner</span><span>Fee</span><span>Due</span></div>${rows||'<div class="empty" style="margin:14px">No projects match this filter.</div>'}<div class="legend">Stages: Before this: the engagement (deposit → NDA → financials → Call 2 → letter → Invoice 1) &nbsp;·&nbsp; 1 Data top-up · 2 Draft · 3 Internal review · 4 Client review · 5 Final report + Invoice 2 · 6 Closed &nbsp;·&nbsp; <span style="color:var(--brand)">■</span> done <span style="color:var(--accent)">■</span> current <span style="color:var(--danger)">■</span> blocked by a gate</div></div>`;
}
function projectsList(r){
  const f = r.q.filter||(r.q.stage?'stage':'live'); const stage=+r.q.stage||0; const svc=r.q.svc||'all'; const ent=r.q.ent||'all';
  let list = DB.projects.slice();
  if(f==='live') list=list.filter(p=>p.status==='active');
  else if(f==='mine') list=list.filter(p=>p.status==='active'&&(p.owner===S.role||p.reviewer===S.role));
  else if(f==='risk') list=list.filter(p=>p.status==='active'&&(blocked(p)||p.risk==='at_risk'||p.overdue));
  else if(f==='delivered') list=list.filter(p=>p.status==='delivered');
  else if(f==='review') list=list.filter(p=>p.status==='active'&&(p.stage===6||p.stage===7));
  else if(f==='stage') list=list.filter(p=>p.status==='active'&&p.stage===stage);
  if(svc!=='all') list=list.filter(p=>p.service===svc);
  if(ent!=='all') list=list.filter(p=>p.entity===ent);
  const q = (o)=>{const m=Object.assign({filter:f,stage,svc,ent},o);return '#/projects?'+Object.entries(m).filter(([a,b])=>b&&b!=='all'&&!(a==='stage'&&!b)).map(([a,b])=>a+'='+b).join('&');};
  const pills = [['live','All live'],['mine','Mine'],['risk','At risk'],['delivered','Delivered']].map(([v,l])=>`<span class="pill${f===v?' active':''}" onclick="go('${q({filter:v,stage:0})}')">${l}</span>`).join('');
  const chip = f==='stage'?`<span class="chip attn" style="padding:5px 10px;font-size:11px">Stage: ${STAGES[stage-1]} <span style="cursor:pointer;margin-left:6px" onclick="go('${q({filter:'live',stage:0})}')">✕</span></span>`:f==='review'?`<span class="chip attn" style="padding:5px 10px;font-size:11px">In review (internal + client) <span style="cursor:pointer;margin-left:6px" onclick="go('${q({filter:'live'})}')">✕</span></span>`:'';
  return `<div class="col"><div class="toolbar"><div class="pills">${pills}</div>${chip}<select class="btn" onchange="go('${q({})}'.replace(/&svc=[^&]*/,'')+'&svc='+this.value)"><option value="all"${svc==='all'?' selected':''}>Service line: all</option>${Object.entries(SERVICE).slice(0,3).map(([v,l])=>`<option value="${v}"${svc===v?' selected':''}>${l}</option>`).join('')}</select><select class="btn" onchange="go('${q({})}'.replace(/&ent=[^&]*/,'')+'&ent='+this.value)"><option value="all"${ent==='all'?' selected':''}>Entity: all</option><option value="CY"${ent==='CY'?' selected':''}>${ENTITY.CY}</option><option value="UK"${ent==='UK'?' selected':''}>${ENTITY.UK}</option></select><div class="spacer"></div><button class="btn primary" onclick="openCreate('project')">+ Project</button></div>${projectsTable(list)}</div>`;
}
</script>
<script>
/* ============ PROJECT DETAIL ============ */
function advanceStage(code){
  const p = proj(code); const g = gate(p);
  if(g){toast(`<b>Stage advance rejected by the server.</b> ${g.reason}.`,'err');render();return;}
  if(p.stage===5){p.stage=6;p.status='delivered';p.due='closed today';const e=p.engagement&&eng(p.engagement);if(e)engLog(e,'Project closed — Invoice 2 paid');log('inactive',`${USERS[S.role].first} closed <b>${p.code}</b>`,'Just now',`#/project/${p.code}`);toast(`<b>${p.code}</b> closed. Invoice 2 paid, final report on file.`,'ok');render();return;}
  p.stage++;
  if(p.stage===5){const f=finalInv(p);if(f&&f.status==='draft'){f.status='sent';f.issued='Today';f.due='+15 days';if(f.num.endsWith('—')){f.num=f.num.replace('—',engNextInvNo(f.entity));}const e=p.engagement&&eng(p.engagement);if(e){const i2=e.invoices.find(x=>x.seq===2);if(i2){i2.status='issued';i2.number=+f.num.split('#')[1];i2.ref='#'+i2.number;i2.issued='Today';i2.due='+15 days';}}}}
  log('inactive',`${USERS[S.role].first} advanced <b>${p.code}</b> to ${STAGES[p.stage-1]}`,'Just now',`#/project/${p.code}`);
  toast(`<b>${p.code}</b> → ${STAGES[p.stage-1]}.${p.stage===5?' Final report delivered — Invoice 2 generated and emailed.':''}`,'ok');
  render();
}
function markData(code,i,st){const p=proj(code);const d=p.data[i];d.status=st;if(st==='received'){const t=p.tasks.find(t=>t.st!=='done'&&t.t.toLowerCase().startsWith('chase')&&t.t.toLowerCase().includes(d.label.toLowerCase().split(' ')[0]));if(t)t.st='done';}render();toast(`${esc(d.label)} → <b>${st}</b>${st==='received'?' · chase task closed':''}.`,'ok');}
function remind(code,i){const p=proj(code);p.data[i].reminders++;render();toast(`Reminder sent to the client for <b>${esc(p.data[i].label)}</b> (chased ×${p.data[i].reminders}).`);}
function resolveComment(code,i){const p=proj(code);p.comments[i].resolved=true;render();}
function commentToTask(code,i){const p=proj(code);const c=p.comments[i];p.tasks.unshift({t:'Address: '+c.body.slice(0,42)+'…',a:p.owner,est:1,st:'todo',src:'comment'});c.task=true;render();toast('Task created from the comment (task.source = comment).','ok');}
function sendMsg(code){const p=proj(code);const ta=$('msg');if(!ta||!ta.value.trim())return;p.thread.push({who:USERS[S.role].name,client:false,internal:S.noteInternal,body:ta.value.trim(),at:'Just now'});render();}
function toggleDone(code){S.doneOpen[code]=!S.doneOpen[code];render();}

function stepper(p){
  return `<div class="stepper">${STAGES.map((s,i)=>{const n=i+1;const cl=p.status==='delivered'||n<p.stage?'done':n===p.stage?'cur'+(blocked(p)?' blk':''):'';return `<div class="step ${cl}" onclick="toast('Stage <b>${s}</b> — ${n<p.stage?'completed':n===p.stage?'in progress':'not started'}. Gate: ${['Invoice 1 paid','data complete','comments resolved','client comments resolved','Invoice 2 paid','—'][i]}.')"><div class="bar"></div><div class="lb">${s}${n<p.stage||p.status==='delivered'?' ✓':''}</div></div>`;}).join('')}</div>`;
}
function projectDetail(r){
  const p = proj(r.id); if(!p) return `<div class="empty">Project not found.</div>`;
  const tab = r.q.tab||'tasks'; const g = gate(p); const c = client(p.client); const cur=p.entity==='UK'?'GBP':'EUR';
  const header = `<div class="card pad" style="display:flex;align-items:center;gap:14px"><div><div style="font:600 17px Newsreader,serif">${p.code} · ${esc(p.clientName)} — ${esc(p.title)}</div><div class="sub11">${ENTITY[p.entity]} · ${k(p.fee,cur)} · Owner ${p.owner} · Reviewer ${p.reviewer} · Due ${p.due}${p.status==='delivered'?' · <span class="success">Delivered</span>':''}${p.risk==='at_risk'?' · <span class="danger">At risk</span>':p.risk==='watch'?' · <span class="muted">Watch</span>':''}</div></div><div class="spacer"></div>
    <button class="btn" onclick="go('#/projects')">← All projects</button><button class="btn" onclick="S.portalProject='${p.code}';go('#/portal')">Preview portal ↗</button><button class="btn" onclick="openCreate('time','${p.code}')">Log time</button>${p.status==='active'?`<button class="btn primary" onclick="advanceStage('${p.code}')">${p.stage===5?'Close project':'Advance stage →'}</button>`:''}</div>`;
  const gateStrip = g?`<div class="gate${g.hard?' hard':''}">⚠ ${g.reason}${g.hard?`<span class="spacer"></span><button class="btn sm" onclick="go('#/invoices?status=overdue')">Open invoice</button>`:''}</div>`:'';
  const tabs = [['tasks','Tasks'],['deliverable','Deliverable & versions'],['data','Data checklist'],['docs','Documents'],['comments',`Review comments${unresolved(p)?` (${unresolved(p)})`:''}`],['time','Time & fees'],['thread','Client thread'],['history','History']].map(([t,l])=>`<span class="tab${tab===t?' active':''}" onclick="go('#/project/${p.code}?tab=${t}')">${l}</span>`).join('');
  let body='';
  if(tab==='tasks'){
    const col = (st,label)=>{const items=p.tasks.map((t,i)=>({t,i})).filter(x=>x.t.st===st);const collapsed=st==='done'&&!S.doneOpen[p.code];
      const cards = collapsed?`<div class="ghost" style="font-size:11px;text-align:center;padding:8px;cursor:pointer" onclick="toggleDone('${p.code}')">collapsed — show ${items.length}</div>`:items.map(({t,i})=>`<div class="bcard${t.active?' attn':''}" draggable="true" ondragstart="dragStart(event,'task','${i}')"><div style="font-size:11px;font-weight:500">${esc(t.t)}</div><div class="m">${t.a}${t.est?` · ${t.est}h est.`:''}${t.log?` · ${t.log}h logged`:''}${t.ai?' · <span class="accent">✦ AI first pass</span>':''}${t.comments?` · reviewer ${p.reviewer} · ${t.comments} comments`:''}${t.src==='comment'?' · <span class="faint">from comment</span>':''}${t.src==='auto'?' · <span class="faint">auto</span>':''}</div></div>`).join('');
      return `<div class="bcol" ondragover="dragOver(event)" ondragleave="this.classList.remove('over')" ondrop="dropTask(event,'${p.code}','${st}')"><div class="bh"><span>${label}</span><span>${items.length}</span></div>${cards}${st==='done'&&S.doneOpen[p.code]?`<div class="ghost" style="font-size:11px;text-align:center;cursor:pointer" onclick="toggleDone('${p.code}')">collapse</div>`:''}</div>`;};
    const board = `<div class="board" style="grid-template-columns:repeat(4,1fr)">${col('todo','To do')}${col('in_progress','In progress')}${col('review','Review')}${col('done','Done')}</div>`;
    const dep = depositInv(p), fin = finalInv(p);
    const right = `<div class="card pad"><div class="h13" style="margin-bottom:6px">Client data checklist</div>${p.data.map(d=>`<div class="kv"><span>${esc(d.label)}${d.required?'':' <span class="faint">(optional)</span>'}</span><span class="${d.status==='received'?'success':d.reminders?'danger':'muted'}">${d.status==='received'?'✓':d.status==='waived'?'waived':d.reminders?`chased ×${d.reminders}`:'requested'}</span></div>`).join('')}</div>
      <div class="card pad"><div class="h13" style="margin-bottom:6px">Deliverable</div><div class="kv"><span>${p.service==='valuation'?'Valuation report':p.service==='feasibility'?'Feasibility study':'Business plan'}</span><span class="muted">${p.version}</span></div><div class="skel" style="height:54px;margin:8px 0"></div><div style="display:flex;gap:6px"><button class="btn sm" onclick="go('#/project/${p.code}?tab=deliverable')">Versions</button><button class="btn sm primary" onclick="${p.stage>=3&&!unresolved(p)?`toast('Draft ${p.version} shared to the client portal. Client review started.','ok')`:`toast('<b>Cannot send.</b> ${p.stage<3?'Draft not yet through internal review':unresolved(p)+' review comments unresolved'} — gate rule.','err')`}">Send to client</button></div></div>
      <div class="card pad"><div class="h13" style="margin-bottom:6px">Fees</div><div class="kv"><span class="k">Deposit 50%</span><span class="${dep.status==='paid'?'':dep.status==='overdue'?'danger':'muted'}">${money(dep.amount,dep.currency)} ${dep.status==='paid'?'paid':dep.status==='overdue'?`overdue ${dep.daysOver||''}d`:dep.status}</span></div><div class="kv"><span class="k">Final 50%</span><span class="${fin.status==='paid'?'':'muted'}">${fin.status==='paid'?money(fin.amount,fin.currency)+' paid':fin.status==='sent'?money(fin.amount,fin.currency)+' issued':'on signature'}</span></div><div class="kv"><span class="k">Time logged</span><span>${p.time}h · ${money(p.wip,cur)} WIP</span></div></div>`;
    body = `<div style="display:grid;grid-template-columns:2.2fr 1fr;gap:16px;align-items:start">${board}<div class="col" style="gap:14px">${right}</div></div>`;
  } else if(tab==='deliverable'){
    const secs = p.sections.map((s,i)=>`<div class="sec${s.state==='drafting'?' active':''}"><span class="muted" style="width:14px">${i+1}</span>${esc(s.title)}<span class="st">${s.state==='final'?'final':s.state==='reviewed'?'✓ reviewed':s.state==='drafted'?'drafted':s.state==='drafting'?'● drafting':'—'}</span></div>`).join('');
    const rail = p.comments.length?p.comments.map((cm,i)=>`<div class="cmt${cm.resolved?' resolved':''}"><div class="who">${USERS[cm.by].name} · §${cm.s+1}${cm.resolved?' · resolved':''}</div><div>${esc(cm.body)}</div>${cm.resolved?'':`<div class="acts"><button class="btn sm" onclick="resolveComment('${p.code}',${i})">Resolve</button>${cm.task?'<span class="faint" style="font-size:10px;padding:5px 0">task created</span>':`<button class="btn sm" onclick="commentToTask('${p.code}',${i})">→ Task</button>`}</div>`}</div>`).join(''):'<div class="ghost" style="font-size:11.5px">No review comments yet. The reviewer adds them here, anchored to a section.</div>';
    body = `<div style="display:grid;grid-template-columns:.8fr 2fr 1fr;gap:14px;align-items:start">
      <div class="card pad" style="padding:10px"><div class="h13" style="padding:6px 10px 8px">Sections</div>${secs}<div style="padding:10px 10px 4px;display:flex;gap:6px"><button class="btn sm brand-o" onclick="toast('✦ AI first pass drafted for §3 Market. Saved as ai_draft — Maria must accept it before it enters the document.')">✦ AI first pass</button></div></div>
      <div class="col" style="gap:10px"><div style="display:flex;align-items:center;gap:8px"><span class="chip">${p.version}</span><span class="faint" style="font-size:11px">edited today by Maria A.</span><div class="spacer"></div><button class="btn sm" onclick="toast('Version history: v0.4 (today) · v0.3 (30 Aug) · v0.2 (26 Aug) · v0.1 (22 Aug). Each version is a document row linked by supersedes_id.')">History</button><button class="btn sm" onclick="toast('Exported as PDF with Consortia letterhead (would download).')">Export PDF</button></div>
        <div class="doc"><h4>3. Market</h4><p>${esc(p.clientName)} operates in a market that grew at roughly 11% a year between 2022 and 2025, driven by regulatory pressure on incumbents and the shift of mid-market buyers toward subscription models. We estimate the addressable segment at €140–160m across Cyprus and Greece.</p><p>The company's share sits at 6–7% by revenue. Three competitors account for half the market; none has a comparable presence in the public-sector niche that produces 40% of ${esc(p.clientName)}'s recurring revenue.</p><p class="faint" style="font-style:italic">[✦ AI first pass — pending analyst review. Sources to verify: market size figure, competitor share.]</p><p>Pricing has been stable. Churn of 8% in FY25 compares favourably with a peer median of 12%, which supports the growth assumptions carried into §4 and the terminal value in §5.</p></div></div>
      <div class="card pad" style="padding:12px;display:flex;flex-direction:column;gap:8px"><div class="h13">Review comments</div>${rail}</div></div>`;
  } else if(tab==='data'){
    const rows = p.data.map((d,i)=>`<div class="trow${d.reminders>=2&&d.status==='requested'?' attn':''}" style="grid-template-columns:1.6fr .6fr .8fr .8fr .7fr 1.4fr"><span>${esc(d.label)}</span><span class="muted">${d.required?'required':'optional'}</span><span class="${d.status==='received'?'success':d.status==='waived'?'muted':'danger'}">${d.status}</span><span class="muted">21 Jul</span><span class="${d.reminders?'danger':'muted'}">${d.reminders?`chased ×${d.reminders}`:'—'}</span><span style="display:flex;gap:5px">${d.status==='requested'?`<button class="btn sm" onclick="markData('${p.code}',${i},'received')">Mark received</button><button class="btn sm" onclick="remind('${p.code}',${i})">Remind</button><button class="btn sm" onclick="markData('${p.code}',${i},'waived')">Waive</button>`:d.status==='received'?`<span class="faint" style="font-size:11px;padding:4px 0">document attached</span>`:`<button class="btn sm" onclick="markData('${p.code}',${i},'requested')">Re-request</button>`}</span></div>`).join('');
    body = `<div class="card rounded"><div class="card-h"><div class="t">Client data checklist</div><span class="s">${p.data.filter(d=>d.status==='received').length} of ${p.data.length} received · instantiated from the ${SERVICE[p.service]} template</span><div class="spacer"></div><button class="btn sm" onclick="toast('Add a checklist item (label, required, due).')">+ Item</button></div><div class="thead" style="grid-template-columns:1.6fr .6fr .8fr .8fr .7fr 1.4fr">Item<span>Required</span><span>Status</span><span>Requested</span><span>Reminders</span><span>Actions</span></div>${rows}<div class="legend">Reminders go out automatically on a schedule while an item is outstanding. A client upload in the portal flips the item to received and closes the internal chase task.</div></div>`;
  } else if(tab==='docs'){
    body = `<div class="col" style="gap:14px">${docsTable(DB.documents.filter(d=>d.project===p.code))}<div class="drop">Drop files here — choose <b>internal</b> or <b>client</b> visibility on upload</div></div>`;
  } else if(tab==='comments'){
    const rows = p.comments.length?p.comments.map((cm,i)=>`<div class="cmt${cm.resolved?' resolved':''}"><div class="who">${USERS[cm.by].name} · §${cm.s+1} ${esc(p.sections[cm.s]?p.sections[cm.s].title:'')}${cm.resolved?' · resolved':''}</div><div>${esc(cm.body)}</div>${cm.resolved?'':`<div class="acts"><button class="btn sm" onclick="resolveComment('${p.code}',${i})">Resolve</button>${cm.task?'<span class="faint" style="font-size:10px;padding:5px 0">task created</span>':`<button class="btn sm" onclick="commentToTask('${p.code}',${i})">→ Task</button>`}</div>`}</div>`).join(''):'<div class="empty">No review comments. They\'re added by the reviewer during Internal review, anchored to a report section.</div>';
    body = `<div style="max-width:720px;display:flex;flex-direction:column;gap:8px">${unresolved(p)?`<div class="gate">⚠ ${unresolved(p)} unresolved — Client review cannot start until these are cleared.</div>`:''}${rows}</div>`;
  } else if(tab==='time'){

function portalUpload(code,i){const p=proj(code);const d=p.data[i];d.status='received';const t=p.tasks.find(t=>t.st!=='done'&&t.t.toLowerCase().startsWith('chase')&&t.t.toLowerCase().includes(d.label.toLowerCase().split(' ')[0]));if(t)t.st='done';const c=client(p.client);const who=c.contacts[0].n;DB.documents.unshift({name:d.label+'.pdf',kind:'other',project:p.code,client:p.clientName,v:1,by:who+' (portal)',vis:'client',date:'Just now'});log('accent',`<b>${esc(who)}</b> uploaded <b>${esc(d.label)}</b>`,`${esc(p.clientName)} · just now`,`#/project/${p.code}`);c.timeline.unshift({t:`<b>${esc(who)}</b> uploaded ${esc(d.label)}`,m:'Just now · portal',auto:true});render();toast(`Upload received. Checklist item → <b>received</b>, internal chase task closed, activity logged. ${outstanding(p)?outstanding(p)+' item(s) still outstanding.':'Data pack complete — Draft can now be completed.'}`,'ok');}
function portalScreen(r){
  if(S.portalEng){const e=eng(S.portalEng);if(e&&!e.project){const preview=`<div class="card pad" style="max-width:860px;margin:0 auto 14px;display:flex;align-items:center;gap:12px;background:var(--attn-soft)"><span style="font-size:12px"><b>Internal preview</b> — you're seeing exactly what <b>${esc(e.contactName)}</b> sees (pre-engagement). Switch:</span><select class="btn" onchange="S.portalEng=this.value||null;if(!this.value)S.portalProject=DB.projects[0].code;render()"><option value="">— a live project —</option>${DB.engagements.filter(x=>!x.project&&engStage(x)!=='declined').map(x=>`<option value="${x.id}"${x.id===e.id?' selected':''}>${x.code} · ${esc(x.companyName)}</option>`).join('')}</select><div class="spacer"></div><button class="btn sm" onclick="go('#/engagement/${e.id}')">Open internal view</button></div>`;return preview+engPortal(e);}S.portalEng=null;}
  const p=proj(S.portalProject)||DB.projects[0]; const c=client(p.client); const contact=c.contacts.find(x=>x.portal)||c.contacts[0];
  const pstep = p.status==='delivered'?4:p.stage<=3?1:p.stage===4?2:3;
  const steps=['Information & drafting','Your review','Final report','Closed'].map((s,i)=>{const n=i+1;const cl=n<pstep||(p.status==='delivered')?'done':n===pstep?'cur':'';return `<div class="step ${cl}" style="cursor:default"><div class="bar"></div><div class="lb">${s}${n<pstep||p.status==='delivered'?' ✓':n===pstep?' ●':''}</div></div>`;}).join('');
  const dep=depositInv(p), fin=finalInv(p);
  const nda=DB.documents.find(d=>d.project===p.code&&d.kind==='nda'), el=DB.documents.find(d=>d.project===p.code&&d.kind==='eng_letter');
  const received=p.data.filter(d=>d.status!=='requested').length+(nda?1:0)+(el?1:0), total=p.data.length+2;
  const need=p.data.map((d,i)=>({d,i})).filter(x=>x.d.status==='requested');
  const rows=need.map(({d,i},n)=>`<div class="pr"><div style="flex:1"><div>${esc(d.label)}</div><div class="m">Requested 21 Jul${d.reminders?` · reminder sent${d.reminders>1?' ×'+d.reminders:''}`:''}</div></div><button class="btn sm${n===0?' primary':''}" onclick="portalUpload('${p.code}',${i})">Upload</button></div>`).join('');
  const done=[...p.data.filter(d=>d.status!=='requested').map(d=>d.label),nda?'NDA':null,el?'Engagement letter':null].filter(Boolean);
  const preview=`<div class="card pad" style="max-width:860px;margin:0 auto 14px;display:flex;align-items:center;gap:12px;background:var(--attn-soft)"><span style="font-size:12px"><b>Internal preview</b> — you're seeing exactly what <b>${esc(contact.n)}</b> sees. Switch engagement:</span><select class="btn" onchange="if(this.value.startsWith('ENG')){S.portalEng=this.value;}else{S.portalProject=this.value;}render()">${DB.engagements.filter(x=>!x.project&&engStage(x)!=='declined').map(x=>`<option value="${x.id}">${x.code} · ${esc(x.companyName)} (pre-engagement)</option>`).join('')}${DB.projects.filter(x=>x.status==='active').map(x=>`<option value="${x.code}"${x.code===p.code?' selected':''}>${x.code} · ${esc(x.clientName)}</option>`).join('')}</select><div class="spacer"></div><button class="btn sm" onclick="go('#/project/${p.code}')">Open internal view</button></div>`;
  const thread=p.thread.filter(m=>!m.internal);
  return `${preview}<div class="portal"><div class="pbar"><span class="wm">CONSORTIA</span><div class="spacer"></div><span style="font-size:12px;opacity:.85">${esc(c.name)} · ${esc(contact.n)}</span><div class="avatar" style="width:26px;height:26px">${contact.n.split(' ').map(w=>w[0]).join('')}</div></div>
    <div class="pbody">
      <div><div style="font:600 16px Newsreader,serif">${esc(p.title)}</div><div class="sub11">Engagement ${p.code} · target delivery ${p.due}</div></div>
      <div class="stepper" style="gap:6px">${steps}</div>
      ${p.status==='delivered'?`<div class="pcard"><div class="ph" style="background:var(--attn)"><b>Your final report is ready</b></div><div class="pr"><div style="flex:1">${esc(p.title)} — final</div><button class="btn sm primary">Download</button></div></div>`:''}
      <div class="pcard"><div class="ph${need.length?' attn':''}"><b>${need.length?`${need.length} item${need.length>1?'s':''} we still need from you`:'Nothing outstanding — thank you'}</b><div class="spacer"></div><span style="font-size:11px;color:var(--text-3)">${received} of ${total} received</span></div>${rows}<div class="pr" style="color:var(--muted)"><div style="flex:1;font-size:11.5px">${done.join(' · ')||'—'}</div><span class="success" style="font-size:11px">received ✓</span></div></div>
      <div class="two">
        <div class="pcard"><div class="ph"><b>Documents & signatures</b></div><div class="pr"><span style="flex:1">NDA</span><span class="${nda&&nda.sig==='signed'?'success':'muted'}">${nda?nda.sig==='signed'?'signed 22 Jul':`<button class="btn sm primary">Sign</button>`:'—'}</span></div><div class="pr"><span style="flex:1">Engagement letter</span><span class="${el&&el.sig==='signed'?'success':'muted'}">${el?el.sig==='signed'?'signed 24 Jul':`<button class="btn sm primary">Sign</button>`:'—'}</span></div><div class="pr"><span style="flex:1">Draft report ${p.version.split(' ')[0]}</span><span class="muted">${p.stage>=4?`<button class="btn sm primary" onclick="toast('Opens the draft for review; approve or comment in-portal.')">Review & approve</button>`:'not yet shared'}</span></div></div>
        <div class="pcard"><div class="ph"><b>Invoices</b></div><div class="pr"><span style="flex:1">${dep.num} · Invoice 1 (on signing)</span><span class="${dep.status==='paid'?'':dep.status==='overdue'?'danger':'muted'}">${money(dep.amount,dep.currency)} ${dep.status==='paid'?'paid':dep.status==='overdue'?'overdue':dep.status==='sent'?`<button class="btn sm primary" onclick="toast('Bank transfer to the account printed on the invoice — no card payment for engagement invoices.')">Pay</button>`:'not yet issued'}</span></div><div class="pr"><span style="flex:1">Invoice 2 (final report)</span><span class="muted">${fin.status==='paid'?'paid':fin.status==='sent'?`${money(fin.amount,fin.currency)} due`:'on completion'}</span></div></div>
      </div>
      <div class="pcard"><div class="ph"><b>Message your team</b></div><div style="padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border-sub)">${thread.length?thread.map(m=>`<div class="msg${m.client?' me':''}"><div class="bub">${esc(m.body)}</div><div class="mt">${esc(m.who)} · ${m.at}</div></div>`).join(''):'<div class="ghost" style="font-size:11.5px">Questions? Write to your engagement team here — they reply within one working day.</div>'}<div style="display:flex;gap:8px"><input class="ta" style="min-height:0;height:34px" placeholder="Write a message…"><button class="btn sm primary" onclick="toast('Sent to the engagement team.')">Send</button></div></div></div>
    </div></div>`;
}

/* ============ CREATE MODAL ============ */
function openCreate(kind,ctx){
  S.menu=null; render();
  const f=(l,inner)=>`<label class="field">${l}${inner}</label>`;
  const clientOpts=DB.clients.map(c=>`<option value="${c.id}"${ctx===c.id?' selected':''}>${esc(c.name)}</option>`).join('');
  const projOpts=active().map(p=>`<option value="${p.code}"${ctx===p.code?' selected':''}>${p.code} · ${esc(p.clientName)}</option>`).join('');
  const forms={
    lead:['New lead',f('Company',`<input id="f1" placeholder="Company name">`)+f('Service line',`<select id="f2"><option value="valuation">Valuation</option><option value="business_plan">Business plan</option><option value="feasibility">Feasibility</option></select>`)+f('Estimated fee (€)',`<input id="f3" type="number" placeholder="15000">`)+f('Source',`<select id="f4"><option>Referral</option><option>Google Ads</option><option>LinkedIn</option><option>Website</option><option>Direct</option></select>`)],
    client:['New client',f('Legal name',`<input id="f1" placeholder="Company Ltd">`)+f('Country',`<select id="f2"><option>Cyprus</option><option>United Kingdom</option><option>Greece</option></select>`)+f('Contracting entity',`<select id="f3"><option value="CY">${ENTITY.CY}</option><option value="UK">${ENTITY.UK}</option></select>`)],
    project:['New project',f('Client',`<select id="f1">${clientOpts}</select>`)+f('Service line (picks the stage template)',`<select id="f2"><option value="valuation">Valuation</option><option value="business_plan">Business plan</option><option value="feasibility">Feasibility</option></select>`)+f('Title',`<input id="f3" placeholder="Business Valuation FY26">`)+f('Fee total (€, no VAT)',`<input id="f4" type="number" placeholder="20000">`)+`<div class="hint">Creating the project instantiates 8 stages, template tasks, the data checklist and both scheduled invoices.</div>`],
    invoice:['New ad hoc invoice',f('Project',`<select id="f1">${projOpts}</select>`)+f('Amount (excl. VAT)',`<input id="f2" type="number" placeholder="2500">`)+f('Description',`<input id="f3" placeholder="Additional site visit">`)],
    time:['Log time',f('Project',`<select id="f1">${projOpts}</select>`)+f('Task',`<input id="f2" placeholder="DCF model">`)+f('Hours',`<input id="f3" type="number" step="0.25" placeholder="1.5">`)+f('Billable',`<select id="f4"><option>Yes</option><option>No</option></select>`)],
  };
  const [title,fields]=forms[kind];
  $('overlay').innerHTML=`<div class="modal" onclick="event.stopPropagation()"><h3>${title}</h3>${fields}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitCreate('${kind}')">Create</button></div></div>`;
  $('overlay').className='overlay open'; $('overlay').onclick=closeModal;
  const first=$('overlay').querySelector('input,select'); if(first) first.focus();
}
function closeModal(){$('overlay').className='overlay';$('overlay').innerHTML='';}
function submitCreate(kind){
  const v=i=>{const el=$('f'+i);return el?el.value:'';};
  if(kind==='lead'){DB.leads.unshift({id:'LN'+Date.now(),company:v(1)||'New lead',service:v(2),fee:+v(3)||0,stage:'call1',src:v(4),p:25});closeModal();go('#/leads');toast('Lead created in Qualifying.','ok');}
  else if(kind==='client'){const c={id:'CLI-0'+(95+DB.clients.length),name:v(1)||'New client',short:(v(1)||'New client').replace(/ Ltd$/,''),reg:'—',country:v(2),industry:'—',currency:v(3)==='UK'?'GBP':'EUR',entity:v(3),owner:S.role,source:'Direct',lifecycle:'lead',interest:'—',contacts:[],timeline:[]};DB.clients.push(c);closeModal();go('#/client/'+c.id);toast('Client record created.','ok');}
  else if(kind==='project'){const c=client(v(1));const svc=v(2);const code='PRJ-0'+(DB.nextProject++);const fee=+v(4)||20000;const p={code,client:c.id,clientName:c.short,title:v(3)||SERVICE[svc]+' engagement',service:svc,stage:1,owner:S.role,reviewer:'AP',fee,due:'TBC',entity:c.entity,status:'active',risk:'ok',time:0,wip:0,version:'v0.1',thread:[],comments:[],start:'Today',data:CHECKLIST[svc].slice(0,4).map(label=>({label,required:true,status:'requested',reminders:0})),sections:SECTIONS[svc].map(title=>({title,state:'todo'})),tasks:[{t:'Send NDA',a:'KM',est:.5,st:'todo'},{t:'Issue engagement letter',a:'KM',est:1,st:'todo'},{t:'Issue deposit invoice',a:'EK',est:.5,st:'todo'},{t:'Request client data pack',a:'MA',est:1,st:'todo'},{t:'Kick-off call',a:S.role,est:1,st:'todo'}]};DB.projects.unshift(p);const pre=c.entity==='UK'?'UKI-':'INV-';const cur=c.entity==='UK'?'GBP':'EUR';DB.invoices.push({num:pre+(DB.nextInv++),project:code,client:c.short,entity:c.entity,type:'deposit_50',amount:fee/2,vat:0,currency:cur,status:'draft',issued:'—',due:'—'});DB.invoices.push({num:pre+(DB.nextInv++),project:code,client:c.short,entity:c.entity,type:'final_50',amount:fee/2,vat:0,currency:cur,status:'draft',issued:'—',due:'—'});log('inactive',`${USERS[S.role].first} created <b>${code}</b>`,`${esc(c.short)} · just now`,`#/project/${code}`);closeModal();go('#/project/'+code);toast(`<b>${code}</b> created from the ${SERVICE[svc]} template — 8 stages, ${p.tasks.length} tasks, ${p.data.length} data requests, 2 scheduled invoices.`,'ok');}
  else if(kind==='invoice'){const p=proj(v(1));const pre=p.entity==='UK'?'UKI-':'INV-';DB.invoices.push({num:pre+(DB.nextInv++),project:p.code,client:p.clientName,entity:p.entity,type:'ad_hoc',amount:+v(2)||0,vat:0,currency:'EUR',status:'draft',issued:'—',due:'—'});closeModal();go('#/invoices?status=draft');toast('Ad hoc invoice drafted.','ok');}
  else if(kind==='time'){const p=proj(v(1));const h=+v(3)||0;p.time+=h;p.wip+=Math.round(h*95);DB.time.rows.unshift({label:`${p.code} · ${v(2)||'Task'}`,go:'#/project/'+p.code,h:[null,null,h,null,null],billable:v(4)==='Yes'});closeModal();toast(`${h}h logged to <b>${p.code}</b>.`,'ok');render();}
}

/* ============ SPEC NOTES (feature requirements per screen) ============ */
function specNotes(r){
  const N={
    dashboard:['Dashboard',['One aggregate endpoint returns KPIs, my tasks, stage counts, utilisation, activity and decisions — no fan-out of five calls.','Every KPI tile, chart bar and task row is a filtered navigation (try them).','Role-aware: analysts get only their tasks, own utilisation and activity — click the user block bottom-left to switch.','Activity feed is read from the append-only activity_log; polling or subscription.','"Needs a partner decision" items are generated from rules (overdue deposit, scope change, capacity ≥90%) and link to the record.'],['Which rules should generate partner-decision items, and who else sees them?']],
    leads:['Leads',['GoHighLevel webhook → ghl_import (raw payload) → Triage view → lead/client. One-way only, never write back.','Kanban with drag-and-drop plus a one-click → advance; List and Forecast are the same data as a sortable, exportable table.','Moving a lead to Call 1 booked → the → button opens an engagement. Won happens inside the engagement (letter signed, Invoice 1 paid), never from the board.','Weighted pipeline, win rate and cycle time are server-computed.','A lead is a client record in an early lifecycle stage — no separate lead object screen.'],['GHL cutover: backfill historic opportunities, or only new leads from go-live? (open question #6)']],
    clients:['Clients',['One record per organisation across pre-sale and delivery; lifecycle = lead / active / dormant.','Row shows the current lead stage when an open lead exists.','Compliance tab was not designed — the fields shown are placeholders.']],
    client:['Client record',['Header: stage chip when an open lead exists, "Convert to engagement" runs the same won-lead transaction.','Timeline mixes automated events (imports, uploads, payments, stage changes) with manual notes and emails.','Compose: Email / Note / ✦ AI draft — AI output always needs a human to send.','Contacts carry primary, billing and portal-access flags; portal users are scoped to this client only.','Documents, Invoices and Projects tabs are filtered views of the firm-wide entities.'],['AI drafting scope: which emails and sections may be AI-drafted, and what review is mandatory? (open question #5)']],
    projects:['Projects list',['Eight stage pips per row: burgundy done · blue current · rust current-but-blocked · track future.','Blocked rows (deposit unpaid) get the amber fill and a rust due value.','Filters: All live / Mine / At risk / Delivered, plus stage (from the dashboard chart), service line and entity — all URL parameters so they are deep-linkable.']],
    project:['Project detail',['Stage stepper from project_stage rows; every "Advance stage →" is validated server-side against the gate rule and the reason renders in the strip. Try advancing PRJ-0141 (2 docs outstanding) or PRJ-0138 (deposit unpaid).','Gate rules: deposit unpaid blocks Draft start · required data outstanding blocks Draft completion · unresolved comments block Client review · final invoice unpaid or unsigned blocks Delivered.','Task board with drag-and-drop; tasks carry provenance (template / manual / comment / AI) and estimate vs logged.','Data checklist: reminders auto-increment ("chased ×N"); a portal upload flips the item to received and closes the chase task.','Deliverable tab (2d direction): sections left, document centre, comments right; a comment can become a task.','Time & fees shows recovery — logged cost against the fixed fee.','Client thread: shared with the portal except messages flagged internal.','History: append-only log for compliance and handover.'],['Final report sign-off: reuse the click-to-sign block from the engagement letter?']],
    docs:['Documents',['Firm-wide vault over the document entity; filter by client, project, kind, visibility.','Version chains via supersedes_id — only the latest is listed, history one click away.','Visibility (internal / client) is the key control: the same vault holds working papers and client deliverables.','Signature status inline from signature_request.']],
    time:['Time',['Weekly grid is inline-editable; totals recompute. Timer state persists across reloads.','Team view flags ≥90% utilisation and suggests reassignment.','Recovery = billable time at cost/charge rate vs fixed fee; >100% is rendered rust and clamped at full width.'],['Cost rate vs charge rate: which drives WIP and recovery?']],
    engagements:['Engagements',['Pre-sale object between a GHL opportunity and a project. Stage machine: deposit_pending → nda_pending → docs_pending → review_pending → proposal → engaged → valuation_active; declined from anywhere before engaged.','Every arrow is a gate in advance_engagement() in Postgres — the UI only asks.','Deposit: €500 invoice with Stripe link at Call 1, webhook flips it; refunded on decline, credited to Invoice 1 on signing.','NDA + engagement letter generated from locked docx templates (docxtemplater) — only the merge fields change. Four approach toggles; both market methods collapse to the single master line.','Click-to-sign on the portal: typed name + checkbox + timestamp + IP + document hash → audit page on the countersigned PDF. No third-party e-sign.','Invoice maths: invoice_schedule(fee) — 50% capped at €5,000 less the €500 deposit on signing; balance on final report. No VAT.','Issuing entity per invoice by country rule (UK client → Consortia Ltd, else Consortia Advisory LLP); bank account by entity + currency; one number sequence per entity.','Start valuation = create the project from the Valuation template, gated on Invoice 1 paid.'],['LLP partnership number for the invoice footer','One Stripe account per entity, or shared?']],
    engagement:['Engagement',['See Engagements. This screen is the six-step workspace: Call 1 deposit · NDA · Financials · Call 2 · Engagement letter · Invoice & start.','Right column reads from agreements, deposits and activity_log.'],[]],
    invoices:['Invoices',['Scoped by the top-bar entity switcher (invoicing entity, not the client). No VAT on any invoice; currency EUR (GBP optional for the LLP). Number sequence per entity: CY continues from #6, LLP from #1.','Deposit and Invoice 1 are created by the engagement; Invoice 2 is generated when the project reaches Final report. PDF is produced by the platform in the Consortia layout (invoice.mjs) with the entity\'s bank block.','Recording a payment clears the deposit gate — try "Record payment" on LLP #4 and then open PRJ-0138.','Overdue rows: amber fill, rust status text. Actions: issue, send, record payment, download PDF.'],['Stripe for the deposit only; engagement invoices by bank transfer — payments recorded manually from the bank statement until an open-banking feed is worth it.']],
    reports:['Reports',['Period and entity pickers; reports can show both entities while other financial screens are scoped to one.','Revenue by service line, lead source conversion (from GHL history), avg. days per stage (data collection is the bottleneck), saved report definitions.','Partner-briefing figures (booked, WIP, overdue) should be the same numbers the dashboard uses.']],
    portal:['Client portal',['Separate auth (portal_user); sees only this client\'s records with visibility = client. Never internal stage names, task detail or staff beyond the engagement team.','The 8 internal stages collapse to 5 plain-language steps.','Upload attaches to the matching data_request, flips it to received, closes the internal chase task and logs activity — try "Upload" on an outstanding item, then check the project.','Signatures and invoices are surfaced with the actions the client can take.','Alternative (2j): a thread-first portal where requests appear as action cards — keep as a variant for owner-managed clients.'],['Payments in-portal or by bank transfer? (open question #3)','E-signature provider (open question #2)']],
  };
  const n=N[r.route]||N.dashboard;
  const global=['Permissions matrix for the six internal roles has not been designed — ask before inventing one (open question #1).','Desktop-only, ~1280px minimum. No shadows, no white, one attention colour.'];
  return `<button class="btn sm x" onclick="S.spec=false;render()">✕</button><h3>${n[0]}</h3><div class="faint" style="font-size:11px">Feature notes from the design handover, plus what this prototype simulates.</div><h4>What this screen requires</h4><ul>${n[1].map(x=>`<li>${x}</li>`).join('')}</ul>${n[2]?`<h4>Open questions</h4><ul>${n[2].map(x=>`<li>${x}</li>`).join('')}</ul>`:''}<h4>Across the product</h4><ul>${global.map(x=>`<li>${x}</li>`).join('')}</ul><h4>Prototype</h4><ul><li>Everything is in-memory sample data — reload the page to reset.</li><li>Gate rules and automations are simulated in the browser; in the real product they run on the server.</li></ul>`;
}

render();
</script>
