<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consortia Advisory OS — clickable prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#800020;--accent:#0C4767;--accent-dk:#0a3a54;--attn:#E6C99B;--attn-b:#D2B183;--attn-soft:#F0DFC4;
  --danger:#9A3B1A;--success:#657153;--surface:#FAF3E9;--sunken:#F3E7DE;--canvas:#E9D7D1;
  --border:#DCC6BF;--border-sub:#E6D4CD;--border-dash:#C9ABA3;--track:#EEDED8;--inactive:#E3CEC7;
  --text:#2A1E20;--text-2:#463639;--text-3:#5A4548;--muted:#6B5457;--faint:#8B7275;--ghost:#9C8386;--on:#FAF3E9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--canvas);font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;font-size:12.5px;line-height:1.5}
a{color:var(--brand);text-decoration:none}a:hover{color:var(--accent)}
b{font-weight:600}
button{font-family:inherit}
.serif{font-family:Newsreader,serif}
.muted{color:var(--muted)}.faint{color:var(--faint)}.ghost{color:var(--ghost)}.danger{color:var(--danger)}.success{color:var(--success)}.accent{color:var(--accent)}
.w500{font-weight:500}.w600{font-weight:600}
.app{display:flex;min-height:100vh}

/* ---- sidebar ---- */
.sidebar{width:216px;flex:none;background:var(--brand);color:var(--on);display:flex;flex-direction:column;padding:20px 14px;gap:2px;position:sticky;top:0;height:100vh}
.brand{padding:0 8px 20px;display:flex;flex-direction:column;gap:2px}
.brand .wm{font:600 15px Newsreader,serif;letter-spacing:.16em}
.brand .sub{font:500 9px Inter,sans-serif;letter-spacing:.22em;color:rgba(250,243,233,.55)}
.nav{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer;transition:background .12s;color:rgba(250,243,233,.82)}
.nav:hover{background:rgba(250,243,233,.14)}
.nav.active{background:var(--on);color:var(--brand);font-weight:600}
.nav .count{margin-left:auto;font-size:10px;background:var(--attn);color:var(--brand);border-radius:9px;padding:1px 7px;font-weight:600}
.nav-h{padding:16px 8px 6px;font:600 9px Inter,sans-serif;letter-spacing:.18em;color:rgba(250,243,233,.45)}
.sb-bottom{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.user{display:flex;align-items:center;gap:9px;padding:12px 8px 0;margin-top:8px;border-top:1px solid rgba(250,243,233,.16);cursor:pointer}
.user .av{width:26px;height:26px;border-radius:50%;background:var(--attn);color:var(--brand);display:flex;align-items:center;justify-content:center;font:600 10px Inter,sans-serif;flex:none}
.user .nm{font:500 12px Inter,sans-serif}.user .rl{font-size:10px;color:rgba(250,243,233,.55)}

/* ---- main ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 28px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.title{font:600 19px Newsreader,serif;white-space:nowrap}
.search{flex:1 1 auto;min-width:150px;max-width:340px;margin-left:12px;height:32px;border:1px solid var(--border);border-radius:16px;background:var(--sunken);padding:0 14px;color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;position:relative}
.search input{border:0;background:transparent;outline:0;font:inherit;color:var(--text);width:100%}
.search input::placeholder{color:var(--faint)}
.search-dd{position:absolute;top:36px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;z-index:20;white-space:normal}
.search-dd div{padding:9px 14px;font-size:12px;cursor:pointer;border-top:1px solid var(--border-sub)}
.search-dd div:first-child{border-top:0}.search-dd div:hover{background:var(--sunken)}
.search-dd .k{font-size:10px;color:var(--faint);margin-left:6px}
.spacer{flex:1}
.entity{font-size:12px;color:var(--muted);cursor:pointer;position:relative;white-space:nowrap}
.btn{border:1px solid var(--border);border-radius:8px;padding:7px 12px;font:500 12px Inter,sans-serif;background:var(--sunken);color:var(--text);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--attn-soft)}
.btn.primary{background:var(--accent);color:var(--on);border-color:var(--accent);padding:8px 14px;font-weight:600}
.btn.primary:hover{background:var(--accent-dk)}
.btn.brand-o{border-color:var(--brand);color:var(--brand);background:transparent}
.btn.sm{padding:4px 9px;font-size:11px}
.btn:focus-visible,.nav:focus-visible,.trow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.content{flex:1;padding:24px 28px 40px}
.col{display:flex;flex-direction:column;gap:18px}
.menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;min-width:200px;z-index:30;overflow:hidden;padding:6px}
.menu div{padding:8px 10px;border-radius:8px;font-size:12px;cursor:pointer;color:var(--text)}
.menu div:hover{background:var(--sunken)}
.menu .mh{font:600 10px Inter,sans-serif;letter-spacing:.08em;color:var(--muted);padding:8px 10px 4px;cursor:default}
.menu .mh:hover{background:transparent}
.rel{position:relative}

/* ---- cards / tables ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.card.pad{padding:18px}
.card.attn{background:var(--attn)}
.card.attn:hover{border-color:var(--brand)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border-sub)}
.card-h .t{font:600 14px Inter,sans-serif}
.card-h .s{font-size:11px;color:var(--muted)}
.h14{font:600 14px Inter,sans-serif}.h13{font:600 13px Inter,sans-serif}
.sub11{font-size:11px;color:var(--muted)}
.thead{display:grid;gap:12px;padding:9px 18px;background:var(--sunken);font:600 10px Inter,sans-serif;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.trow{display:grid;gap:12px;padding:13px 18px;border-top:1px solid var(--border-sub);font-size:12.5px;align-items:center}
.trow.click{cursor:pointer}.trow.click:hover{background:var(--sunken)}
.trow.attn{background:var(--attn)}.trow.attn:hover{background:var(--attn-soft)}
.trow>span:first-child{font-weight:500}
.trow.tot{font-weight:600;background:var(--sunken)}
.rounded{overflow:hidden}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border-sub);font-size:12px}
.kv:first-child{border-top:0;padding-top:0}
.kv .k{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer}
.kpi:hover{background:var(--sunken)}
.kpi.attn{background:var(--attn)}.kpi.attn:hover{border-color:var(--brand);background:var(--attn)}
.kpi .l{font:500 11px Inter,sans-serif;color:var(--muted);letter-spacing:.04em}
.kpi.attn .l{color:var(--text-3)}
.kpi .v{font:400 30px Newsreader,serif;margin-top:6px}
.kpi .d{font-size:11px;margin-top:2px}
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
.chip{display:inline-block;font-size:10px;padding:2px 8px;border-radius:9px;background:var(--sunken);color:var(--text-2);white-space:nowrap}
.chip.attn{background:var(--attn);color:var(--text-3)}
.chip.brand{background:var(--brand);color:var(--on)}
.chip.accent{background:var(--accent);color:var(--on)}
.chip.sm{font-size:9px;padding:1px 7px}
.pills{display:flex;gap:6px}
.pill{padding:6px 12px;border-radius:8px;font:500 12px Inter,sans-serif;cursor:pointer;color:var(--muted);border:1px solid transparent}
.pill:hover{background:var(--sunken)}
.pill.active{background:var(--brand);color:var(--on)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 6px}
.tab{padding:10px 12px;font:500 12px Inter,sans-serif;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);font-weight:600;border-bottom-color:var(--brand)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:8px;border-radius:2px;background:var(--track)}
.pips i.done{background:var(--brand)}.pips i.cur{background:var(--accent)}.pips i.blk{background:var(--danger)}
.stepper{display:flex;gap:5px}
.step{flex:1;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.step .bar{height:6px;border-radius:4px;background:var(--track)}
.step .lb{font-size:9.5px;color:var(--ghost);text-align:center;line-height:1.3}
.step.done .bar{background:var(--brand)}.step.done .lb{color:var(--muted)}
.step.cur .bar{height:10px;background:var(--accent)}.step.cur .lb{color:var(--text);font-weight:600}
.step.cur.blk .bar{background:var(--danger)}
.gate{background:var(--attn);border:1px solid var(--attn-b);border-radius:8px;padding:9px 14px;font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:10px}
.gate.hard{color:var(--danger);font-weight:500}
.board{display:grid;gap:11px}
.bcol{background:var(--canvas);border:1px solid var(--border-sub);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:7px;min-height:80px}
.bcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.bcol .bh{font:600 10px Inter,sans-serif;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;padding:2px 4px;display:flex;justify-content:space-between;align-items:center}
.bcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.bcard:hover{background:var(--sunken)}
.bcard.attn{background:var(--attn)}
.bcard .n{font-size:12px;font-weight:600}
.bcard .m{font-size:10.5px;color:var(--muted)}
.bcard .f{display:flex;align-items:center;gap:6px}
.adv{margin-left:auto;width:20px;height:20px;border-radius:6px;border:1px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:var(--text);flex:none}
.adv:hover{background:var(--accent);color:var(--on);border-color:var(--accent)}
.bar-h{display:flex;align-items:flex-end;gap:12px;height:120px}
.bar-h>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;justify-content:flex-end;height:100%}
.bar-h .b{width:100%;background:var(--inactive);border-radius:5px 5px 0 0}
.bar-h .b:hover{opacity:.85}
.bar-h .l{font-size:10px;color:var(--muted);text-align:center}
.util{display:flex;align-items:center;gap:10px;font-size:12px}
.util .n{width:62px;color:var(--muted)}.util .tr{flex:1;height:8px;background:var(--track);border-radius:4px;overflow:hidden}.util .fl{height:100%;background:var(--accent);border-radius:4px}.util .p{width:36px;text-align:right}
.act{display:flex;gap:11px}
.act .dot{width:8px;height:8px;border-radius:50%;background:var(--inactive);margin-top:5px;flex:none}
.act .tx{font-size:12px;line-height:1.5}.act .mt{font-size:11px;color:var(--faint)}
.dot-accent{background:var(--accent)!important}.dot-success{background:var(--success)!important}.dot-brand{background:var(--brand)!important}
.decision{background:var(--attn);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:9px}
.decision:hover{border-color:var(--brand)}
.decision .t{font:600 13px Inter,sans-serif}
.decision .li{font-size:12px;line-height:1.65;color:var(--text-2);cursor:pointer}
.decision .li:hover{color:var(--brand)}
.avatar{border-radius:50%;background:var(--attn);color:var(--brand);display:flex;align-items:center;justify-content:center;font:600 10px Inter,sans-serif;flex:none}
.avatar.sq{border-radius:10px;background:var(--brand);color:var(--on);font-size:14px}
.drop{border:1px dashed var(--border-dash);border-radius:10px;padding:18px;text-align:center;color:var(--ghost);font-size:11.5px}
.empty{border:1px dashed var(--border-dash);border-radius:12px;padding:40px;text-align:center;color:var(--ghost);font-size:12.5px}
.ta{width:100%;min-height:70px;border:1px solid var(--border);border-radius:8px;background:var(--sunken);padding:9px 11px;font:inherit;color:var(--text);resize:vertical;outline:0}
.ta:focus{border-color:var(--accent)}
input.cell{width:100%;border:0;background:transparent;text-align:center;font:inherit;color:var(--text);outline:0;padding:4px 0;border-radius:6px}
input.cell:focus{background:var(--attn-soft)}
.msg{display:flex;flex-direction:column;gap:3px;max-width:70%}
.msg .bub{padding:9px 12px;border-radius:12px;background:var(--sunken);font-size:12px;line-height:1.5}
.msg.me{align-self:flex-end}.msg.me .bub{background:var(--accent);color:var(--on)}
.msg .mt{font-size:10px;color:var(--faint)}
.msg.internal .bub{background:var(--attn-soft);border:1px dashed var(--attn-b)}
.sec{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:12px;cursor:pointer}
.sec:hover{background:var(--sunken)}.sec.active{background:var(--attn)}
.sec .st{margin-left:auto;font-size:10px;color:var(--muted)}
.doc{background:var(--sunken);border:1px solid var(--border);border-radius:10px;padding:18px 22px;font-family:Newsreader,serif;font-size:13.5px;line-height:1.7;color:var(--text-2);min-height:300px}
.doc h4{font:600 16px Newsreader,serif;margin:0 0 8px}
.doc p{margin:0 0 10px}
.cmt{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.cmt.resolved{opacity:.55}
.cmt .who{font-size:10.5px;color:var(--faint)}
.cmt .acts{display:flex;gap:6px}

/* ---- toast / drawer / modal ---- */
.toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:380px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:12px;line-height:1.5}
.toast.err{border-left-color:var(--danger)}.toast.ok{border-left-color:var(--success)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:360px;background:var(--surface);border-left:1px solid var(--border);z-index:60;padding:22px 24px;overflow:auto;display:none;font-size:12px;line-height:1.6}
.drawer.open{display:block}
.drawer h3{font:600 17px Newsreader,serif;margin:0 0 4px}
.drawer h4{font:600 10px Inter,sans-serif;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:18px 0 6px}
.drawer ul{margin:0;padding-left:16px}.drawer li{margin-bottom:5px}
.drawer .x{position:absolute;top:18px;right:18px}
.specbtn{border:1px solid var(--brand);color:var(--brand);background:transparent;border-radius:8px;padding:7px 12px;font:500 12px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.specbtn:hover,.specbtn.on{background:var(--brand);color:var(--on)}
.overlay{position:fixed;inset:0;background:rgba(42,30,32,.35);z-index:80;display:none;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:440px;padding:22px;display:flex;flex-direction:column;gap:12px}
.modal h3{font:600 17px Newsreader,serif;margin:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
.field input,.field select{border:1px solid var(--border);border-radius:8px;background:var(--sunken);padding:8px 10px;font:inherit;color:var(--text);font-size:12.5px;outline:0}
.field input:focus,.field select:focus{border-color:var(--accent)}
.notif{position:absolute;top:calc(100% + 6px);right:0;width:320px;background:var(--surface);border:1px solid var(--border);border-radius:12px;z-index:30;overflow:hidden}
.notif .n{padding:10px 14px;border-top:1px solid var(--border-sub);font-size:12px;cursor:pointer}
.notif .n:first-child{border-top:0}.notif .n:hover{background:var(--sunken)}
.notif .n .m{font-size:10.5px;color:var(--faint)}

/* ---- portal ---- */
.portal{max-width:860px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.pbar{background:var(--brand);color:var(--on);padding:14px 18px;display:flex;align-items:center;gap:12px}
.pbar .wm{font:600 14px Newsreader,serif;letter-spacing:.16em}
.pbody{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.pcard{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.pcard .ph{padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:12.5px}
.pcard .ph.attn{background:var(--attn)}
.pcard .pr{padding:11px 14px;border-top:1px solid var(--border-sub);display:flex;align-items:center;gap:12px;font-size:12px}
.pcard .pr .m{font-size:10.5px;color:var(--faint)}
.hint{font-size:11px;color:var(--faint);font-style:italic}
.legend{font-size:10.5px;color:var(--faint);padding:10px 18px;border-top:1px solid var(--border-sub)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.skel{background:var(--inactive);border-radius:6px}
@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- engagement module ---- */
.ehead{display:flex;align-items:flex-start;gap:20px}
.money{margin-left:auto;display:flex;gap:26px}.money div{display:flex;flex-direction:column}.money .l{font-size:10.5px;color:var(--muted)}.money .v{font:600 20px Newsreader,serif}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.field.w{grid-column:1/-1}.field input:disabled{opacity:.6}
.toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;width:max-content;background:var(--surface)}
.toggle button{border:0;background:transparent;padding:6px 11px;font:500 12px Inter,sans-serif;color:var(--muted);cursor:pointer}.toggle button.on{background:var(--brand);color:var(--on)}.toggle button:disabled{cursor:default;opacity:.7}
.appr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.ap{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--surface);display:flex;gap:10px;align-items:flex-start;cursor:pointer;text-align:left;font:inherit;color:var(--text)}
.ap .bx{width:16px;height:16px;border:1.5px solid var(--ghost);border-radius:4px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.ap.on{border-color:var(--brand);background:var(--sunken)}.ap.on .bx{background:var(--brand);border-color:var(--brand)}.ap:disabled{cursor:default}
.ap .n{font-weight:600;font-size:12.5px}.ap .d{font-size:11px;color:var(--muted)}
.doc mark{background:var(--attn);padding:0 2px;border-radius:2px;color:var(--text)}.doc .sec{font-weight:600;margin-top:12px}.doc ul{margin:0 0 9px 18px;padding:0}.doc li{margin:2px 0}.doc.small{font-size:12.5px;max-height:320px;overflow:auto}
.inv{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;align-items:center;font-size:12px}.inv .a{font:600 14px Newsreader,serif;text-align:right}.inv .t{color:var(--muted);font-size:11px}
.invc{border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px;display:flex;flex-direction:column;gap:7px}
.ent{display:flex;align-items:center;gap:10px;font-size:11.5px;flex-wrap:wrap}.ent .k{color:var(--muted)}.entd{font-size:11px;color:var(--muted);line-height:1.4}
.tl{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--text-2)}.tl div{display:flex;gap:8px}.tl span:first-child{color:var(--faint);width:52px;flex:none}
.dl{display:flex;flex-direction:column;gap:6px}.dl .d{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px}.dl .d .st{margin-left:auto;font-size:11px;color:var(--muted)}.dl .d.up{background:var(--sunken)}
.stripe{display:inline-flex;align-items:center;gap:8px;background:#635BFF;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:600 12px Inter,sans-serif;cursor:pointer}.stripe:hover{background:#4f47e6}
.ivm{background:#fff;color:#222;width:640px;max-height:92vh;overflow:auto;padding:36px 40px;border-radius:6px;font:11.5px/1.45 Helvetica,Arial,sans-serif;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ivm .x{position:absolute;top:10px;right:10px}
.ivtop{display:flex;justify-content:space-between;align-items:flex-start}.ivlogo{font:400 26px Newsreader,serif;letter-spacing:.04em}.ivh{text-align:right}.ivh h1{font:300 32px/1 Helvetica,Arial,sans-serif;margin:0;color:#333}.ivh div{color:#555;margin-top:3px}
.ivmeta{display:flex;justify-content:space-between;margin-top:20px}.ivmeta b{display:block}.ivbill{margin-top:16px}.ivbill span{color:#777;display:block}
.ivdates{width:230px}.ivdates div{display:flex;justify-content:space-between;padding:3px 10px}.ivdates div span:first-child{color:#777}.ivdates .bal{background:#f0f0f0;font-weight:700;padding:7px 10px;margin-top:3px}.ivdates .bal span{color:#222}
.ivt{width:100%;border-collapse:collapse;margin-top:34px}.ivt th{background:#333;color:#fff;font-weight:400;text-align:left;padding:6px 10px}.ivt td{padding:10px;vertical-align:top}.ivt th:nth-child(n+2),.ivt td:nth-child(n+2){text-align:right}
.ivtot{width:220px;margin:22px 0 0 auto}.ivtot div{display:flex;justify-content:space-between;padding:4px 10px}.ivtot span:first-child{color:#777}
.ivnotes{margin-top:26px;line-height:1.5}.ivnotes span{color:#777}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toasts" id="toasts"></div>
<div class="drawer" id="drawer"></div>
<div class="overlay" id="overlay"></div>
<script>
/* ============ ENGAGEMENTS (pre-sale: Call 1 → engagement letter → valuation start) ============ */
const APPROACHES=[
  {id:'dcf',n:'Income — DCF',d:'Discounted Cash Flow analysis',line:'Income Approach (Discounted Cash Flow DCF Analysis)'},
  {id:'cca',n:'Market — Comparables',d:'Comparable Company Analysis',line:'Market Approach (Comparable Company Analysis)'},
  {id:'pt',n:'Market — Precedents',d:'Precedent Transactions',line:'Market Approach (Precedent Transactions)'},
  {id:'nav',n:'Asset-based — NAV',d:'Net Asset Value method',line:'Asset-Based Approach (Net Asset Value - NAV Method)'}];
const DEPOSIT=500, CAP=5000;
const ENTITY_DETAIL={
  CY:{name:'Consortia Ltd',addr:'Efesou 9, 5280 Paralimni, Cyprus',lines:['Efesou 9, Paralimni','5280, Cyprus','Tel +357 99 637 198','VAT No: CY10386363Z','TIC No: 10386363Z','info@consortiaadvisory.com']},
  UK:{name:'Consortia Advisory LLP',addr:'71-75 Shelton Street, Covent Garden, London WC2H 9JQ, United Kingdom',lines:['71-75 Shelton Street','Covent Garden, London','WC2H 9JQ, United Kingdom']}};
const BANKS={'CY-EUR':{name:'CONSORTIA LTD',no:'357035231876',iban:'CY71002001950000357035231876',swift:'BCYPCY2N'},
  'UK-EUR':{name:'CONSORTIA ADVISORY LLP',no:'357046171948',iban:'CY05002001950000357046171948',swift:'BCYPCY2N'},
  'UK-GBP':{name:'CONSORTIA ADVISORY LLP',no:'357046171964',iban:'CY58002001950000357046171964',swift:'BCYPCY2N'}};
const UKC=['uk','united kingdom','gb','great britain','england','scotland','wales','northern ireland'];
const defaultEntity=c=>UKC.includes((c||'').trim().toLowerCase())?'CY':'UK';   // UK client → Cyprus company; everyone else → LLP
function approachLines(sel){const s=new Set(sel),o=[];if(s.has('dcf'))o.push(APPROACHES[0].line);if(s.has('cca')&&s.has('pt'))o.push('Market Approach (Comparable Company Analysis & Precedent Transactions)');else if(s.has('cca'))o.push(APPROACHES[1].line);else if(s.has('pt'))o.push(APPROACHES[2].line);if(s.has('nav'))o.push(APPROACHES[3].line);return o;}
function schedule(fee){const half=Math.min(fee*.5,CAP);return{half,inv1:Math.max(half-DEPOSIT,0),inv2:fee-half};}
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function longDate(iso){const d=new Date(iso+'T00:00:00');const n=d.getDate();const s=(n%10==1&&n!=11)?'st':(n%10==2&&n!=12)?'nd':(n%10==3&&n!=13)?'rd':'th';return `${n}<sup>${s}</sup> ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;}
const TODAY='2026-09-06', NOW='6 Sep';
const eng=id=>DB.engagements.find(e=>e.id===id);
const engStage=e=>{if(e.call2.outcome==='declined')return 'declined';if(e.project)return 'valuation_active';if(e.el.status==='signed')return 'engaged';if(e.call2.held)return 'proposal';if(e.docs.filter(d=>d.req!==false).every(d=>d.up))return 'review_pending';if(e.nda.status==='signed')return 'docs_pending';if(e.deposit.status!=='pending')return 'nda_pending';return 'deposit_pending';};
const ESTAGE={deposit_pending:['Awaiting deposit','attn'],nda_pending:['NDA outstanding','attn'],docs_pending:['Awaiting financials','attn'],review_pending:['Ready for Call 2',''],proposal:['Proposal — letter pending','attn'],engaged:['Engaged — Invoice 1 due','accent'],valuation_active:['Valuation in progress','brand'],declined:['Declined','']};
const ESTEPS=[{n:'Call 1 deposit',done:e=>e.deposit.status!=='pending'},{n:'NDA',done:e=>e.nda.status==='signed'},{n:'Financials',done:e=>e.docs.filter(d=>d.req!==false).every(d=>d.up)},{n:'Call 2 · review',done:e=>!!e.call2.held},{n:'Engagement letter',done:e=>e.el.status==='signed'},{n:'Invoice & start',done:e=>!!e.project}];
const engCur=e=>{const i=ESTEPS.findIndex(s=>!s.done(e));return i<0?5:i;};
function engLog(e,m){e.activity.unshift({t:NOW,m});log('inactive',`<b>${e.code}</b> · ${m}`,`${esc(e.companyName||e.contactName)} · just now`,`#/engagement/${e.id}`);}
function engNextInvNo(ent){return ++DB.invNo[ent];}

/* ---- factory + seeds ---- */
function mkEng(o,level){
  const e=Object.assign({country:'Cyprus',isIndividual:false,contactTitle:'Director',fee:0,approaches:['dcf','cca','pt'],deposit:{status:'pending'},depositInvoice:null,nda:{status:'none'},docs:[{l:'Audited financial statements (last 3 years)'},{l:'Management accounts YTD'},{l:'Debt schedule & bank facilities'},{l:'Shareholder register'},{l:'Budget / forecast (if any)',req:false}],call2:{held:null,outcome:null},el:{status:'none',version:0},invoices:[],project:null,activity:[],fathom1:'https://fathom.video/share/c1',fathom2:''},o);
  e.el.data={client_name:e.contactName,client_title:e.contactTitle,company_name:e.companyName,company_address:e.address,company_tax_id:e.taxId,letter_date:TODAY,fee:e.fee,approaches:e.approaches.slice()};
  const ent=defaultEntity(e.country);
  if(level>=0){e.depositInvoice={seq:0,trigger:'Call 1 deposit',desc:'Refundable Deposit for Business Valuation Assessment',amount:500,currency:'EUR',entity:ent,number:engNextInvNo(ent),status:'issued',issued:e.t0||'1 Sep',due:'+7 days',link:'https://book.stripe.com/6oU5kx8AKc3I7t799d2sM00'};e.activity.push({t:e.t0||'1 Sep',m:`Deposit invoice #${e.depositInvoice.number} issued by ${ENTITY_DETAIL[ent].name}`});}
  if(level>=1){e.deposit={status:'paid',intent:'pi_3Q'+e.id.slice(-4),paid_at:e.t1||'2 Sep'};e.depositInvoice.status='paid';e.activity.push({t:e.t1||'2 Sep',m:'Stripe webhook: €500 deposit paid'});}
  if(level>=2){e.nda={status:'signed',sent_at:e.t1||'2 Sep',signed_at:e.t2||'3 Sep',signer:{name:e.contactName,ip:'85.72.14.9',sha:'sha256:9f2c…e41a'}};e.activity.push({t:e.t2||'3 Sep',m:'NDA signed by '+e.contactName});}
  else if(level===1&&e.ndaSent){e.nda={status:'sent',sent_at:e.t1||'2 Sep'};}
  if(level>=3){e.docs.forEach(d=>d.up=e.t3||'4 Sep');e.activity.push({t:e.t3||'4 Sep',m:'Financials complete — Call 2 unlocked'});}
  else if(level===2&&e.docsUp){e.docs.slice(0,e.docsUp).forEach(d=>d.up=e.t2||'3 Sep');}
  if(level>=4){e.call2={held:e.t4||'5 Sep',outcome:'proceed'};e.fathom2='https://fathom.video/share/c2';e.activity.push({t:e.t4||'5 Sep',m:'Call 2 held — client agreed to full valuation'});}
  if(level>=5){e.el.status='signed';e.el.version=1;e.el.sent_at=e.t5||'5 Sep';e.el.signed_at=e.t5||'5 Sep';e.el.signer={name:e.contactName,ip:'85.72.14.9',sha:'sha256:4b7d…c902'};e.deposit.status='credited';const s=schedule(e.fee);e.invoices=[{seq:1,trigger:'On signing',desc:'Business Valuation — 50% on signing of the engagement letter, less €500 deposit paid',amount:s.inv1,currency:'EUR',status:'scheduled',entity:ent},{seq:2,trigger:'On final report',desc:'Business Valuation — balance on delivery of the final report',amount:s.inv2,currency:'EUR',status:'scheduled',entity:ent}];e.activity.push({t:e.t5||'5 Sep',m:'Engagement letter signed · deposit credited · invoices scheduled'});}
  if(level>=6){const i=e.invoices[0];i.status='issued';i.number=engNextInvNo(ent);i.ref='#'+i.number;i.issued=e.t5||'5 Sep';i.due='+15 days';}
  if(level>=7){e.invoices[0].status='paid';e.invoices[0].paid=e.t7||'6 Sep';}
  if(o.declined){e.call2={held:e.t4||'2 Sep',outcome:'declined'};e.deposit.status='refunded';e.depositInvoice.status='refunded';e.activity.push({t:e.t4||'2 Sep',m:'Client declined after Call 2 — deposit refunded'});}
  e.activity.reverse();
  return e;
}
function seedEngagements(){
  DB.engagements=[
    mkEng({id:'ENG-0142',code:'ENG-0142',lead:'L14',contactName:'Maria Kotsovou',contactTitle:'Managing Director',email:'maria@aegeanmarine.gr',companyName:'Aegean Marine Supplies Ltd',address:'Leoforos Vouliagmenis 112, Glyfada 166 74, Athens',country:'Greece',taxId:'EL099887766',fee:5000,t0:'28 Aug',t1:'29 Aug',t2:'30 Aug',t3:'3 Sep',t4:'5 Sep'},4),
    mkEng({id:'ENG-0141',code:'ENG-0141',client:'CLI-0092',contactName:'Nikos Delis',email:'nikos@delphi.io',companyName:'Delphi Analytics Ltd',address:'Arch. Makariou III 155, Limassol 3026',country:'Cyprus',taxId:'CY10412331P',fee:24000,approaches:['dcf','cca','pt','nav'],t0:'20 Aug',t1:'21 Aug',t2:'22 Aug',t3:'28 Aug',t4:'1 Sep',t5:'2 Sep'},6),
    mkEng({id:'ENG-0140',code:'ENG-0140',client:'CLI-0083',contactName:'Andreas Pavlou',email:'a.pavlou@aegisfoods.com',companyName:'Aegis Foods Ltd',address:'Industrial Area, Larnaca 7100',country:'Cyprus',taxId:'CY10233990W',fee:0,docsUp:2,t0:'25 Aug',t1:'26 Aug',t2:'27 Aug'},2),
    mkEng({id:'ENG-0139',code:'ENG-0139',client:'CLI-0093',contactName:'James Whitfield',email:'jw@sablecapital.co.uk',companyName:'Sable Capital LLP',address:'22 Bishopsgate, London EC2N 4BQ',country:'United Kingdom',taxId:'GB 402 7761 08',fee:0,ndaSent:true,t0:'1 Sep',t1:'2 Sep'},1),
    mkEng({id:'ENG-0138',code:'ENG-0138',lead:'L12',contactName:'Zlatko Adzovic',email:'zlatko@hidesign.ba',companyName:'Hidesign Sarajevo doo',address:'Vladislava Skarica 10, 71000 Sarajevo',country:'Bosnia and Herzegovina',taxId:'4200488080001',fee:0,t0:'4 Sep'},0),
    mkEng({id:'ENG-0137',code:'ENG-0137',contactName:'Lena Fischer',email:'lf@northwind-log.de',companyName:'Northwind Logistics GmbH',address:'Hafenstraße 4, 20457 Hamburg',country:'Germany',taxId:'DE 311 998 402',fee:0,declined:true,t0:'18 Aug',t1:'19 Aug',t2:'20 Aug',t3:'26 Aug',t4:'29 Aug'},3),
  ];
  // link leads
  DB.engagements.forEach(e=>{if(e.lead){const l=DB.leads.find(x=>x.id===e.lead);if(l){l.eng=e.id;l.company=e.companyName.replace(/ (Ltd|LLP|GmbH|doo)$/,'');l.service='valuation';l.fee=e.fee||l.fee;l.stage=engStage(e)==='proposal'?'proposal':'engaged';l.tag=null;}}});
}
function openEngagement(l){
  const id='ENG-0'+(DB.nextEng++);
  const e=mkEng({id,code:id,lead:l.id,contactName:'Primary contact',email:'contact@'+l.company.toLowerCase().replace(/[^a-z]/g,'')+'.com',companyName:l.company+' Ltd',address:'—',country:'Cyprus',taxId:'—',fee:l.fee||0},-1);
  DB.engagements.unshift(e); l.eng=id; l.stage='engaged'; l.tag=null;
  engLog(e,'Engagement opened from GHL opportunity — Call 1 booked');
  go('#/engagement/'+id); toast(`<b>${id}</b> opened. First step: raise the €500 deposit invoice.`,'ok');
}

/* ---- actions ---- */
function raiseDepositInvoice(id){const e=eng(id);const ent=defaultEntity(e.country);e.depositInvoice={seq:0,trigger:'Call 1 deposit',desc:'Refundable Deposit for Business Valuation Assessment',amount:500,currency:'EUR',entity:ent,number:engNextInvNo(ent),status:'issued',issued:NOW,due:'+7 days',link:'https://book.stripe.com/6oU5kx8AKc3I7t799d2sM00'};engLog(e,`Deposit invoice #${e.depositInvoice.number} issued by ${ENTITY_DETAIL[ent].name} with Stripe link`);toast(`Deposit invoice #${e.depositInvoice.number} generated and emailed with the Stripe link.`,'ok');render();}
function payDeposit(id){const e=eng(id);e.deposit={status:'paid',intent:'pi_3Q'+Math.random().toString(36).slice(2,8),paid_at:NOW};if(e.depositInvoice)e.depositInvoice.status='paid';engLog(e,'Stripe webhook: €500 deposit paid');toast('<b>Deposit paid.</b> Stripe webhook received — NDA step unlocked.','ok');render();}
function refundDeposit(id){const e=eng(id);e.deposit.status='refunded';if(e.depositInvoice)e.depositInvoice.status='refunded';engLog(e,'Deposit refunded via Stripe');toast('Deposit refunded to the client.','ok');render();}
function generateNDA(id){const e=eng(id);if(e.deposit.status==='pending')return toast('<b>Gate:</b> the €500 deposit must be paid before the NDA is issued.','err');e.nda={status:'draft',data:{client_name:e.contactName,is_individual:e.isIndividual,client_address:e.address,client_country:e.country,nda_date:TODAY}};engLog(e,'NDA generated from locked template (nda-2026-09)');toast('NDA generated. Preview below — send when happy.');render();}
function sendNDA(id){const e=eng(id);e.nda.status='sent';e.nda.sent_at=NOW;engLog(e,'NDA emailed to '+e.email+' with portal sign link');toast('NDA sent. The client signs it on the portal.','ok');render();}
function clientSign(id,kind){const e=eng(id);const a=e[kind];const exp=e.contactName;
  if((S.portalName||'').trim().toLowerCase()!==exp.toLowerCase())return toast(`Type your name exactly as it appears on the document: <b>${esc(exp)}</b>`,'err');
  if(!S.portalAgree)return toast('Tick the acceptance box to sign.','err');
  a.status='signed';a.signed_at=NOW;a.signer={name:S.portalName,ip:'85.72.14.9',ua:'Safari 19 · macOS',sha:'sha256:'+Math.random().toString(16).slice(2,6)+'…'+Math.random().toString(16).slice(2,6)};S.portalName='';S.portalAgree=false;
  engLog(e,(kind==='nda'?'NDA':'Engagement letter')+' signed by '+a.signer.name+' — countersigned PDF + audit page stored');
  DB.documents.unshift({name:(kind==='nda'?'NDA':'Engagement letter')+' — '+e.companyName+' (signed).pdf',kind:kind==='nda'?'nda':'eng_letter',project:e.code,client:e.companyName,v:1,by:a.signer.name+' (portal)',vis:'client',date:'Just now',sig:'signed'});
  if(kind==='el'){e.deposit.status='credited';const s=schedule(e.el.data.fee);const ent=defaultEntity(e.country);e.invoices=[{seq:1,trigger:'On signing',desc:'Business Valuation — 50% on signing of the engagement letter, less €500 deposit paid',amount:s.inv1,currency:'EUR',status:'scheduled',entity:ent},{seq:2,trigger:'On final report',desc:'Business Valuation — balance on delivery of the final report',amount:s.inv2,currency:'EUR',status:'scheduled',entity:ent}];e.fee=e.el.data.fee;engLog(e,'Deposit credited against Invoice 1 · invoice schedule created · issuer '+ENTITY_DETAIL[ent].name);
    }
  toast('<b>Signed.</b> Countersigned PDF generated and filed under Documents.','ok');render();}
function engUpload(id,i){const e=eng(id);e.docs[i].up=NOW;engLog(e,'Client uploaded: '+e.docs[i].l);DB.documents.unshift({name:e.docs[i].l+'.pdf',kind:'fs',project:e.code,client:e.companyName,v:1,by:e.contactName+' (portal)',vis:'client',date:'Just now'});render();}
function recordCall2(id,outcome){const e=eng(id);if(!ESTEPS[2].done(e))return toast('<b>Gate:</b> required financials are still missing — the six-page review needs them.','err');e.call2={held:NOW,outcome};e.fathom2='https://fathom.video/share/c2';
  if(outcome==='declined'){e.deposit.status='refunded';if(e.depositInvoice)e.depositInvoice.status='refunded';engLog(e,'Client declined after Call 2 — deposit refunded, GHL opportunity → Lost');const l=e.lead&&DB.leads.find(x=>x.id===e.lead);if(l){l.stage='lost';l.reason='declined after review';}toast('Marked as declined. Deposit refund issued via Stripe.','ok');}
  else{engLog(e,'Call 2 held — client agreed to full valuation');const l=e.lead&&DB.leads.find(x=>x.id===e.lead);if(l)l.stage='proposal';toast('Call 2 recorded. Draft the engagement letter.','ok');S.engSel=4;}render();}
function setEL(id,k,v){eng(id).el.data[k]=k==='fee'?Number(v):v;render();}
function toggleAppr(id,a){const arr=eng(id).el.data.approaches;const i=arr.indexOf(a);i<0?arr.push(a):arr.splice(i,1);render();}
function generateEL(id){const e=eng(id);const d=e.el.data;if(!(e.call2.held&&e.call2.outcome==='proceed'))return toast('<b>Gate:</b> record Call 2 with outcome "proceed" first.','err');if(!d.approaches.length)return toast('Pick at least one valuation approach.','err');if(!(d.fee>0))return toast('Enter the professional fee.','err');e.el.version++;e.el.status='draft';engLog(e,`Engagement letter v${e.el.version} generated (template el-2026-09) — fee ${money(d.fee)}, ${approachLines(d.approaches).length} approach line(s)`);toast(`Engagement letter v${e.el.version} generated. Fields locked; unlock to edit and regenerate.`);render();}
function unlockEL(id){eng(id).el.status='none';render();}
function sendEL(id){const e=eng(id);e.el.status='sent';e.el.sent_at=NOW;engLog(e,'Engagement letter emailed to '+e.email+' with portal sign link');toast('Engagement letter sent.','ok');render();}
function setEntity(id,seq,code){const i=eng(id).invoices.find(x=>x.seq===seq);i.entity=code;if(code==='CY')i.currency='EUR';render();}
function setCurrency(id,seq,c){eng(id).invoices.find(x=>x.seq===seq).currency=c;render();}
function previewInvoice(id,seq){S.preview={id,seq};render();}
function engIssue(id,seq){const e=eng(id);const i=e.invoices.find(x=>x.seq===seq);i.status='issued';i.number=engNextInvNo(i.entity);i.ref='#'+i.number;i.issued=NOW;i.due='+15 days';engLog(e,`Invoice ${seq} issued as ${ENTITY_DETAIL[i.entity].name} #${i.number} — PDF emailed, due in 15 days`);toast(`Invoice #${i.number} generated and emailed.`,'ok');render();}
function engPaid(id,seq){const e=eng(id);const i=e.invoices.find(x=>x.seq===seq);i.status='paid';i.paid=NOW;engLog(e,`Invoice ${seq} paid`);render();}
function startValuation(id){const e=eng(id);if(e.el.status!=='signed')return toast('<b>Gate:</b> engagement letter not signed.','err');const i1=e.invoices.find(x=>x.seq===1);if(!i1||i1.status!=='paid')return toast('<b>Gate:</b> Invoice 1 must be paid before work starts.','err');
  const code=winEngagement(e);e.project=code;engLog(e,`Valuation started — ${code} created from the Valuation template`);toast(`<b>Valuation started.</b> ${code} created: 6 stages, task list, data top-up checklist. Invoice 2 scheduled for the final report.`,'ok');go('#/project/'+code);}

/* ---- screens ---- */
function engagementsList(r){
  const f=r.q.filter||'live';
  let list=DB.engagements.slice(); if(f==='live')list=list.filter(e=>!['declined','valuation_active'].includes(engStage(e)));else if(f==='started')list=list.filter(e=>engStage(e)==='valuation_active');else if(f==='declined')list=list.filter(e=>engStage(e)==='declined');
  const pills=[['live','In progress'],['started','Valuation started'],['declined','Declined'],['all','All']].map(([v,l])=>`<span class="pill${f===v?' active':''}" onclick="go('#/engagements?filter=${v}')">${l}</span>`).join('');
  const kp=s=>DB.engagements.filter(e=>engStage(e)===s).length;
  const strip=`<div class="kpis" style="grid-template-columns:repeat(4,1fr)"><div class="kpi" onclick="go('#/engagements')"><div class="l">Awaiting deposit / NDA</div><div class="v">${kp('deposit_pending')+kp('nda_pending')}</div><div class="d muted">after Call 1</div></div><div class="kpi" onclick="go('#/engagements')"><div class="l">Awaiting financials</div><div class="v">${kp('docs_pending')}</div><div class="d muted">chased every 3 working days</div></div><div class="kpi${kp('proposal')?' attn':''}" onclick="go('#/engagements')"><div class="l">Proposal — letter pending</div><div class="v">${kp('proposal')}</div><div class="d muted">after Call 2</div></div><div class="kpi" onclick="go('#/engagements')"><div class="l">Engaged — Invoice 1 due</div><div class="v">${kp('engaged')}</div><div class="d muted">valuation starts on payment</div></div></div>`;
  const rows=list.map(e=>{const st=engStage(e);const [lab,cl]=ESTAGE[st];const cur=engCur(e);const nxt=st==='declined'?'—':st==='valuation_active'?`<a href="#/project/${e.project}">${e.project}</a>`:ESTEPS[cur].n;return `<div class="trow click" style="grid-template-columns:.7fr 1.4fr .8fr 1.2fr .9fr .7fr .6fr" onclick="go('#/engagement/${e.id}')"><span>${e.code}</span><span>${esc(e.companyName)}<div class="sub11">${esc(e.contactName)} · ${esc(e.country)}</div></span><span class="muted">${defaultEntity(e.country)==='CY'?'Consortia Ltd':'Consortia LLP'}</span><span><span class="chip ${cl}">${lab}</span></span><span class="muted">${nxt}</span><span>${e.fee?money(e.fee):'<span class="ghost">—</span>'}</span><span class="muted">${e.deposit.status}</span></div>`;}).join('');

  const depDone=e.deposit.status!=='pending',ndaReady=e.nda.status==='sent',ndaDone=e.nda.status==='signed',elReady=e.el.status==='sent',elDone=e.el.status==='signed';
  const signBlock=kind=>`<div style="padding:12px 14px;border-top:1px solid var(--border-sub);display:flex;flex-direction:column;gap:10px"><label class="field">Type your full name to sign (${esc(e.contactName)})<input value="${esc(S.portalName||'')}" oninput="S.portalName=this.value" placeholder="${esc(e.contactName)}"></label><label style="display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--text-2)"><input type="checkbox" ${S.portalAgree?'checked':''} onchange="S.portalAgree=this.checked"><span>I have read this document and I am authorised to sign it on behalf of ${e.isIndividual?'myself':esc(e.companyName)}. I agree that typing my name here is my electronic signature.</span></label><div class="toolbar"><button class="btn primary" onclick="clientSign('${e.id}','${kind}')">Sign ${kind==='nda'?'NDA':'engagement letter'}</button><span class="hint">We record the date, time and IP address with your signature.</span></div></div>`;
  const card=(t,h,body,cls)=>`<div class="pcard" style="${cls==='lock'?'opacity:.5':cls==='done'?'opacity:.75':''}"><div class="ph${cls===''?' attn':''}"><b>${t}</b><div class="spacer"></div><span class="sub11">${h}</span></div>${body||''}</div>`;
  const steps=['Deposit','NDA','Financials','Engagement letter','Invoices'];const cur=!depDone?0:!ndaDone?1:!ESTEPS[2].done(e)?2:!elDone?3:4;
  return `<div class="portal"><div class="pbar"><span class="wm">CONSORTIA</span><div class="spacer"></div><span style="font-size:12px;opacity:.85">${esc(e.companyName)} · ${esc(e.contactName)}</span></div><div class="pbody">
    <div><div style="font:600 16px Newsreader,serif">Welcome back, ${esc(e.contactName.split(' ')[0])}.</div><div class="sub11">Business valuation · ${e.code}</div></div>
    <div class="stepper" style="gap:6px">${steps.map((s,i)=>`<div class="step ${i<cur?'done':i===cur?'cur':''}" style="cursor:default"><div class="bar"></div><div class="lb">${s}${i<cur?' ✓':i===cur?' ●':''}</div></div>`).join('')}</div>
    ${card('1. Reserve your review — €500 deposit',depDone?'paid '+(e.deposit.paid_at||'')+(e.deposit.status==='credited'?' · credited to Invoice 1':e.deposit.status==='refunded'?' · refunded':''):'refundable in full if you decide not to continue',depDone?'':`<div class="pr"><span style="flex:1">Refundable in full if you decide not to continue after your review.</span><button class="stripe" onclick="payDeposit('${e.id}')">Pay €500 with Stripe</button></div>`,depDone?'done':'')}
    ${card('2. Sign the non-disclosure agreement',ndaDone?'signed '+e.nda.signed_at:ndaReady?'ready to sign':depDone?'being prepared':'after the deposit',ndaReady?signBlock('nda'):ndaDone?`<div class="pr"><span style="flex:1">Mutual NDA</span><span class="success">signed ✓ · <a href="#" onclick="return false">Download</a></span></div>`:'',ndaDone?'done':ndaReady?'':'lock')}
    ${card('3. Upload your financials',ndaDone?`${e.docs.filter(d=>d.up).length} of ${e.docs.length} received`:'unlocks once the NDA is signed',ndaDone?e.docs.map((d,i)=>`<div class="pr"><span style="flex:1">${esc(d.l)}${d.req===false?' <span class="m">(optional)</span>':''}</span>${d.up?'<span class="success">received ✓</span>':`<button class="btn sm primary" onclick="engUpload('${e.id}',${i})">Upload</button>`}</div>`).join(''):'',ESTEPS[2].done(e)?'done':ndaDone?'':'lock')}
    ${card('4. Sign your engagement letter',elDone?'signed '+e.el.signed_at:elReady?'read the full letter, then sign at the bottom':'sent after your review call',elReady?`<div style="padding:12px 14px;border-top:1px solid var(--border-sub)"><div class="doc small">${letterPreview(e.el.data,approachLines(e.el.data.approaches)).replace('<div class="doc">','').slice(0,-6)}</div></div>`+signBlock('el'):elDone?`<div class="pr"><span style="flex:1">Engagement letter — countersigned</span><span class="success">signed ✓ · <a href="#" onclick="return false">Download</a></span></div>`:'',elDone?'done':elReady?'':'lock')}
    ${card('5. Invoices',elDone?'':'after signing',elDone?[e.depositInvoice,...e.invoices].filter(Boolean).map(i=>`<div class="pr"><span style="flex:1">${i.seq===0?'Deposit':'Invoice '+i.seq} — ${i.trigger}<div class="m">from ${ENTITY_DETAIL[i.entity].name}${i.number?' · #'+i.number:''} · no VAT</div></span><span class="chip ${i.status==='paid'||i.status==='credited'?'accent':i.status==='issued'?'attn':''}">${i.status}</span><span style="width:70px;text-align:right">${money(i.amount,i.currency)}</span></div>`).join(''):'',elDone?'':'lock')}
  </div></div>`;
}

/* ---- project created when the valuation starts (replaces lead → project) ---- */
function winEngagement(e){
  const code='PRJ-0'+(DB.nextProject++);
  let c=e.client?client(e.client):null;
  if(!c){c={id:'CLI-0'+(95+DB.clients.length),name:e.companyName,short:e.companyName.replace(/ (Ltd|LLP|GmbH|doo|d\.o\.o\.)$/,''),reg:e.taxId,country:e.country,industry:'—',currency:'EUR',entity:'CY',owner:'KM',source:'GHL',lifecycle:'active',interest:'Valuation',contacts:[{n:e.contactName,r:e.contactTitle,primary:true,portal:true}],timeline:[]};DB.clients.push(c);e.client=c.id;}
  const fee=e.el.data.fee||e.fee;
  const p={code,client:c.id,clientName:c.short,title:'Business Valuation — '+c.short,service:'valuation',stage:1,owner:'KM',reviewer:'AP',fee,due:'TBC',entity:'CY',status:'active',risk:'ok',time:0,wip:0,version:'v0.1',thread:[],comments:[],engagement:e.id,start:'Today',
    data:[{label:'Latest management accounts (top-up)',required:true,status:'requested',reminders:0},{label:'Clarifications on debt schedule',required:false,status:'requested',reminders:0}],
    sections:SECTIONS.valuation.map(title=>({title,state:'todo'})),
    tasks:[{t:'Normalise financial statements',a:'MA',est:4,st:'todo'},{t:'Build DCF model',a:'KM',est:8,st:'todo'},{t:'Comparable set & multiples',a:'AP',est:4,st:'todo'},{t:'Draft report',a:'KM',est:10,st:'todo'},{t:'Partner review',a:'AP',est:3,st:'todo'},{t:'Client walkthrough call',a:'KM',est:1,st:'todo'}]};
  DB.projects.unshift(p);
  const ent=defaultEntity(e.country);
  [e.depositInvoice,...e.invoices].filter(Boolean).forEach(i=>DB.invoices.push({num:(i.entity==='UK'?'LLP ':'CY ')+'#'+(i.number||'—'),project:code,client:c.short,entity:i.entity,type:i.seq===0?'deposit':'inv'+i.seq,amount:i.amount,vat:0,currency:i.currency,status:i.status==='paid'?'paid':i.status==='issued'?'sent':'draft',issued:i.issued||'—',due:i.due||'—',paid:i.status==='paid'?'✓':null,eng:e.id,seq:i.seq}));
  c.timeline.unshift({t:`<b>${code} created</b> — valuation started from ${e.code}`,m:'Just now · automated',auto:true});
  const l=e.lead&&DB.leads.find(x=>x.id===e.lead);if(l){l.stage='won';l.project=code;l.client=c.id;}
  return code;
}

<script>
/* ============ STATE, HELPERS, ROUTING ============ */
DB = seed(); seedEngagements();
const S = {preview:null,engSel:null,engId:null,portalEng:null,portalName:'',portalAgree:false,entity:'CY',role:'KM',spec:false,menu:null,search:'',portalProject:'PRJ-0141',lostOpen:false,doneOpen:{},leadView:'pipeline',timerOn:false,triageSel:null,docOpen:null,noteInternal:false};
const $ = id=>document.getElementById(id);
const esc = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const money = (n,cur='EUR')=>{const sym=cur==='GBP'?'£':'€';return sym+Math.round(n).toLocaleString('en-GB');};
const k = (n,cur='EUR')=>{const sym=cur==='GBP'?'£':'€';return sym+(n/1000).toLocaleString('en-GB',{maximumFractionDigits:1})+'k';};
const proj = code=>DB.projects.find(p=>p.code===code);
const client = id=>DB.clients.find(c=>c.id===id);
const active = ()=>DB.projects.filter(p=>p.status==='active');
const depositInv = p=>DB.invoices.find(i=>i.project===p.code&&i.type==='inv1');
const finalInv = p=>DB.invoices.find(i=>i.project===p.code&&i.type==='inv2');
const unresolved = p=>p.comments.filter(c=>!c.resolved).length;
const outstanding = p=>p.data.filter(d=>d.required&&d.status==='requested').length;
const finalSigned = p=>!!DB.documents.find(d=>d.project===p.code&&d.kind==='deliverable'&&d.sig==='signed');

/* gate rules — in the real product these run server-side */
function gate(p){
  if(p.status!=='active') return null;
  const dep = depositInv(p);
  if(dep && dep.status!=='paid') return {hard:true,reason:`Invoice 1 ${money(dep.amount,dep.currency)} unpaid${dep.daysOver?` — ${dep.daysOver} days overdue`:''} — work is on hold`};
  if(p.stage===1 && outstanding(p)>0) return {hard:false,reason:`${outstanding(p)} required item${outstanding(p)>1?'s':''} outstanding — Draft cannot start`};
  if(p.stage===2 && outstanding(p)>0) return {hard:false,reason:`${outstanding(p)} required document${outstanding(p)>1?'s':''} outstanding — Draft cannot be completed`};
  if(p.stage===3 && unresolved(p)>0) return {hard:false,reason:`${unresolved(p)} unresolved review comment${unresolved(p)>1?'s':''} — Client review cannot start`};
  if(p.stage===4 && unresolved(p)>0) return {hard:false,reason:`${unresolved(p)} unresolved client comment${unresolved(p)>1?'s':''} — Final report cannot be issued`};
  if(p.stage===5){const f=finalInv(p);if(!f||f.status!=='paid')return {hard:false,reason:`Invoice 2 unpaid — cannot close`};}
  return null;
}
const blocked = p=>{const g=gate(p);return !!(g&&g.hard);};

function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.innerHTML=msg;$('toasts').appendChild(t);setTimeout(()=>t.remove(),4200);}
function log(dot,html,meta,go){DB.activity.unshift({dot,html,meta,go});}
function go(h){S.menu=null;location.hash=h;}
function parseRoute(){
  const h = location.hash.replace(/^#\/?/,'')||'dashboard';
  const [path,qs] = h.split('?');
  const seg = path.split('/');
  const q = {};(qs||'').split('&').forEach(kv=>{if(!kv)return;const [a,b]=kv.split('=');q[a]=decodeURIComponent(b||'');});
  return {route:seg[0],id:seg[1],q};
}
window.addEventListener('hashchange',render);
document.addEventListener('click',e=>{if(!e.target.closest('.rel')&&S.menu){S.menu=null;render();}});

/* ============ SHELL ============ */

}
function pageTitle(r){
  if(r.route==='engagements')return 'Engagements';if(r.route==='engagement'){const e=eng(r.id);return e?`Engagement · ${e.code}`:'Engagement';}
  switch(r.route){
    case 'dashboard':return 'Dashboard';case 'leads':return 'Leads';case 'clients':return 'Clients';
    case 'client':{const c=client(r.id);return c?c.name:'Client';}
    case 'projects':return 'Projects';
    case 'project':{const p=proj(r.id);return p?`${p.code} · ${p.title}`:'Project';}
    case 'docs':return 'Documents';case 'time':return 'Time';case 'invoices':return 'Invoices';case 'reports':return 'Reports';case 'portal':return 'Client portal preview';
  }
  return 'Dashboard';
}
function searchResults(){
  const q = S.search.trim().toLowerCase(); if(q.length<2) return '';
  const out=[];
  DB.projects.filter(p=>(p.code+' '+p.clientName+' '+p.title).toLowerCase().includes(q)).slice(0,4).forEach(p=>out.push(`<div onclick="go('#/project/${p.code}')">${p.code} · ${esc(p.title)}<span class="k">project · ${esc(p.clientName)}</span></div>`));

  DB.invoices.filter(i=>i.num.toLowerCase().includes(q)).slice(0,2).forEach(i=>out.push(`<div onclick="go('#/invoices')">${i.num}<span class="k">invoice · ${esc(i.client)}</span></div>`));
  if(!out.length) return `<div class="search-dd"><div class="ghost" style="cursor:default">Nothing matches “${esc(S.search)}”</div></div>`;
  return `<div class="search-dd">${out.join('')}</div>`;
}
function topbar(r){
  const entLabel = S.entity==='BOTH'?'Both entities':ENTITY[S.entity];

    </div>

}

function render(){
  const r = parseRoute();

  switch(r.route){

const LEAD_STAGES = [['new','New (GHL)'],['call1','Call 1 booked'],['engaged','In engagement'],['proposal','Proposal — letter out'],['won','Won → Project'],['lost','Lost / Nurture']];
function leadCard(l){
  const svc = SERVICE[l.service];
  const meta = l.fee?`${svc} · ${k(l.fee)} est.`:svc;
  let tag='';
  if(l.stage==='won') tag=`<span class="chip brand sm" onclick="event.stopPropagation();go('#/project/${l.project}')" style="cursor:pointer">${l.project} created</span>`;
  else if(l.eng) tag=`<span class="chip accent sm" onclick="event.stopPropagation();go('#/engagement/${l.eng}')" style="cursor:pointer">${l.eng} · ${ESTAGE[engStage(eng(l.eng))][0]}</span>`;
  else if(l.tag) tag=`<span class="chip sm ${l.tag.includes('e-sign')?'attn':''}">${l.tag}</span>`;
  else if(l.stage==='lost') tag=`<span class="chip sm">${l.reason}</span>`;
  const adv = ['won','lost'].includes(l.stage)?'':l.stage==='call1'&&!l.eng?`<button class="adv" title="Open engagement (Call 1 held)" onclick="event.stopPropagation();openEngagement(DB.leads.find(x=>x.id==='${l.id}'))">→</button>`:l.eng?'':`<button class="adv" title="Advance one stage" onclick="event.stopPropagation();advanceLead('${l.id}')">→</button>`;
  return `<div class="bcard" draggable="true" ondragstart="dragStart(event,'lead','${l.id}')" onclick="${l.client?`go('#/client/${l.client}')`:`toast('Lead <b>${esc(l.company)}</b> — opens the client/lead record (not yet qualified, so no client record exists).')`}">
    <div class="n">${esc(l.company)}</div><div class="m">${meta}</div>
    <div class="f"><span class="chip sm">${l.src}</span>${tag}${adv}</div></div>`;
}
function leads(r){
  const view = r.q.view||S.leadView; S.leadView=view;
  const pills = ['pipeline','list','forecast','triage'].map(v=>`<span class="pill${view===v?' active':''}" onclick="go('#/leads?view=${v}')">${v[0].toUpperCase()+v.slice(1)}</span>`).join('');
  const open = DB.leads.filter(l=>!['won','lost'].includes(l.stage));
  const weighted = open.reduce((s,l)=>s+l.fee*l.p/100,0);
  const won=DB.leads.filter(l=>l.stage==='won').length, lost=DB.leads.filter(l=>l.stage==='lost').length;
  const toolbar = `<div class="toolbar"><div class="pills">${pills}</div><select class="btn"><option>Source: all</option><option>Google Ads</option><option>Referral</option><option>LinkedIn</option><option>Website</option></select><select class="btn"><option>Service line: all</option><option>Valuation</option><option>Business plan</option><option>Feasibility</option></select><div class="spacer"></div><span class="chip attn" style="padding:6px 12px;font-size:11px;cursor:pointer" onclick="DB.ghlSynced='just now';render();toast('GoHighLevel sync requested — webhook backlog checked, 0 new records.')">⟳ GoHighLevel synced ${DB.ghlSynced}</span></div>`;
  const footer = `<div class="card pad" style="display:flex;gap:28px;font-size:12px"><span class="muted">Weighted pipeline <b style="color:var(--text)">${k(weighted)}</b></span><span class="muted">Avg. lead → engagement letter <b style="color:var(--text)">11 days</b></span><span class="muted">Win rate <b style="color:var(--text)">${Math.round(won/(won+lost)*100)}%</b></span></div>`;
  let body='';
  if(view==='pipeline'){
    const cols = LEAD_STAGES.map(([st,label])=>{
      const items = DB.leads.filter(l=>l.stage===st);
      const collapsed = st==='lost'&&!S.lostOpen;
      const cards = collapsed?`<div class="ghost" style="font-size:11px;text-align:center;padding:10px;cursor:pointer" onclick="S.lostOpen=true;render()">collapsed — show ${items.length}</div>`:items.map(leadCard).join('');
      return `<div class="bcol" ondragover="dragOver(event)" ondragleave="this.classList.remove('over')" ondrop="dropLead(event,'${st}')"><div class="bh"><span>${label}</span><span>${items.length}</span></div>${cards}${st==='lost'&&S.lostOpen?`<div class="ghost" style="font-size:11px;text-align:center;cursor:pointer" onclick="S.lostOpen=false;render()">collapse</div>`:''}</div>`;
    }).join('');
    body = `<div class="board" style="grid-template-columns:repeat(6,1fr)">${cols}</div>`;
  } else if(view==='list'||view==='forecast'){
    const rows = DB.leads.filter(l=>view==='list'||!['won','lost'].includes(l.stage)).map(l=>`<div class="trow click" style="grid-template-columns:1.4fr 1fr 1.1fr .6fr .5fr .6fr .8fr" onclick="${l.client?`go('#/client/${l.client}')`:'void 0'}"><span>${esc(l.company)}</span><span class="muted">${SERVICE[l.service]}</span><span class="muted">${LEAD_STAGES.find(x=>x[0]===l.stage)[1]}</span><span>${l.fee?k(l.fee):'—'}</span><span class="muted">${l.p}%</span><span class="muted">${l.close||'—'}</span><span class="muted">${l.src}</span></div>`).join('');
    body = `<div class="card rounded"><div class="card-h"><div class="t">${view==='forecast'?'Pipeline forecast':'All leads'}</div><div class="spacer"></div><button class="btn sm" onclick="toast('Export → XLSX (would download).')">Export</button></div><div class="thead" style="grid-template-columns:1.4fr 1fr 1.1fr .6fr .5fr .6fr .8fr">Lead<span>Service</span><span>Stage</span><span>Fee</span><span>P%</span><span>Close</span><span>Source</span></div>${rows}</div>`;
  } else {
    const items = DB.leads.filter(l=>l.stage==='new');

    const list = items.map(l=>`<div class="trow click${sel&&sel.id===l.id?' attn':''}" style="grid-template-columns:1fr auto" onclick="S.triageSel='${l.id}';render()"><span>${esc(l.company)}</span><span class="chip sm">${l.src}</span></div>`).join('');
    const detail = sel?`<div style="display:flex;flex-direction:column;gap:12px"><div class="h14">${esc(sel.company)}</div>
      <div><div class="kv"><span class="k">GHL contact</span><span>ghl_${sel.id.toLowerCase()}_8812 · matched: none</span></div><div class="kv"><span class="k">Form</span><span>“${SERVICE[sel.service]} enquiry” · ${sel.src}</span></div><div class="kv"><span class="k">Service line</span><span>${SERVICE[sel.service]} <span class="faint">(mapped from form field)</span></span></div><div class="kv"><span class="k">Contact</span><span>info@${sel.company.toLowerCase().replace(/[^a-z]/g,'')}.com · +357 99 ••• •••</span></div><div class="kv"><span class="k">UTM</span><span class="faint">google / cpc / valuation-cy-2026</span></div><div class="kv"><span class="k">Received</span><span>Today 06:12 · mapping v3</span></div></div>
      <div class="hint">Every import is accepted, corrected or discarded exactly once. Nothing is written back to GoHighLevel.</div>
      <div style="display:flex;gap:8px"><button class="btn primary" onclick="triage('${sel.id}','qualifying')">Qualify</button><button class="btn" onclick="triage('${sel.id}','nurture')">Nurture</button><button class="btn" onclick="triage('${sel.id}','discard')">Discard</button></div></div>`:`<div class="empty">Inbox clear — every GoHighLevel import has been triaged.</div>`;
    body = `<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:14px;align-items:start"><div class="card rounded"><div class="card-h"><div class="t">Untriaged imports</div><div class="spacer"></div><span class="s">${items.length}</span></div>${list||'<div class="empty" style="margin:14px">Nothing waiting.</div>'}</div><div class="card pad">${detail}</div></div>`;
  }
  return `<div class="col">${toolbar}${body}${footer}</div>`;
}
function triage(id,action){
  const l = DB.leads.find(x=>x.id===id);
  if(action==='qualifying'){l.stage='qualifying';l.p=25;l.fee=l.fee||15000;toast(`<b>${esc(l.company)}</b> qualified → client record created (lifecycle: lead).`,'ok');}
  else if(action==='nurture'){l.stage='lost';l.reason='timing — nurture';toast(`<b>${esc(l.company)}</b> moved to nurture.`);}
  else {DB.leads.splice(DB.leads.indexOf(l),1);toast(`Import discarded. Logged in ghl_import as <i>discarded</i>.`);}
  S.triageSel=null;render();
}
function advanceLead(id){
  const l = DB.leads.find(x=>x.id===id);
  const order = ['new','call1','engaged','proposal','won'];
  const i = order.indexOf(l.stage); if(i<0||i>=order.length-1) return;
  moveLead(l,order[i+1]);
}
function moveLead(l,st){
  if(st===l.stage) return;
  if(st==='won'){toast('A lead is won when the engagement letter is signed and Invoice 1 is paid — open its engagement and finish the steps there.','err');return;}
  if(st==='engaged'||st==='proposal'){if(l.eng){go('#/engagement/'+l.eng);return;}openEngagement(l);return;}
  l.stage=st; l.p={new:10,call1:25,engaged:50,proposal:80,lost:0}[st]; l.tag=null;
  if(st==='lost') l.reason='no reason recorded';
  if(!l.fee&&st!=='new') l.fee=15000;
  render();
}
function winLead(l){ if(l.eng){go('#/engagement/'+l.eng);return;} openEngagement(l);return;
  // legacy (pre-engagement) conversion kept for reference

  const code = 'PRJ-0'+(DB.nextProject++);
  const entity = 'CY';
  let c = l.client?client(l.client):null;
  if(!c){c={id:'CLI-0'+(95+DB.clients.length),name:l.company+' Ltd',short:l.company,reg:'HE —',country:'Cyprus',industry:'—',currency:'EUR',entity,owner:'KM',source:l.src,lifecycle:'active',interest:SERVICE[l.service],contacts:[{n:'Primary contact',r:'Owner',primary:true,portal:true}],timeline:[]};DB.clients.push(c);}
  const p = {code,client:c.id,clientName:c.short,title:SERVICE[l.service]+' — new engagement',service:l.service,stage:1,owner:'KM',reviewer:'AP',fee:l.fee||15000,due:'TBC',entity,status:'active',risk:'ok',time:0,wip:0,version:'v0.1',thread:[],comments:[],
    data:CHECKLIST[l.service].slice(0,4).map(label=>({label,required:true,status:'requested',reminders:0})),
    sections:SECTIONS[l.service].map(title=>({title,state:'todo'})),
    tasks:[{t:'Send NDA',a:'KM',est:.5,st:'todo'},{t:'Issue engagement letter',a:'KM',est:1,st:'todo'},{t:'Issue deposit invoice',a:'EK',est:.5,st:'todo'},{t:'Request client data pack',a:'MA',est:1,st:'todo'},{t:'Kick-off call',a:'KM',est:1,st:'todo'}],start:'Today'};
  DB.projects.unshift(p);
  const pre = entity==='UK'?'UKI-':'INV-';
  DB.invoices.push({num:pre+(DB.nextInv++),project:code,client:c.short,entity,type:'deposit_50',amount:p.fee/2,vat:0,currency:'EUR',status:'draft',issued:'—',due:'—'});
  DB.invoices.push({num:pre+(DB.nextInv++),project:code,client:c.short,entity,type:'final_50',amount:p.fee/2,vat:0,currency:'EUR',status:'draft',issued:'—',due:'—'});
  l.stage='won';l.p=100;l.project=code;l.client=c.id;l.tag=null;
  c.timeline.unshift({t:`<b>${code} created</b> from won lead`,m:'Just now · automated',auto:true});
  log('brand',`<b>${code}</b> created from won lead — ${esc(l.company)}`,'Automated · just now',`#/project/${code}`);
  render();
  toast(`Lead won. In one transaction: <b>${code}</b> created from the ${SERVICE[l.service]} template (8 stages, ${p.tasks.length} tasks, ${p.data.length} data requests), portal user invited, and both 50% invoices scheduled.`,'ok');
}
/* drag & drop */
let DRAG=null;
function dragStart(e,type,id){DRAG={type,id};e.dataTransfer.effectAllowed='move';}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('over');}
function dropLead(e,st){e.preventDefault();e.currentTarget.classList.remove('over');if(!DRAG||DRAG.type!=='lead')return;const l=DB.leads.find(x=>x.id===DRAG.id);DRAG=null;moveLead(l,st);}
function dropTask(e,code,st){e.preventDefault();e.currentTarget.classList.remove('over');if(!DRAG||DRAG.type!=='task')return;const p=proj(code);const t=p.tasks[+DRAG.id];DRAG=null;t.st=st;if(st==='done')t.active=false;render();}
